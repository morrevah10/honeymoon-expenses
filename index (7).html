  );
}

/* =========================================================================
   Expense sheet
   ========================================================================= */

function ExpenseSheet({ ctx, initial, presetDate, presetWallet, onClose }) {
  const config = ctx.config;
  const isEdit = !!initial;

  const startWallet = initial ? (walletOf(initial) || LODGING) : (presetWallet || CREDIT);
  const [wallet, setWallet] = useState(startWallet);
  const [preTrip, setPreTrip] = useState(initial ? !!initial.preTrip : false);
  const [date, setDate] = useState(initial ? initial.date : (presetDate || todayISO()));
  const [title, setTitle] = useState(initial ? initial.title || '' : '');
  const [notes, setNotes] = useState(initial ? initial.notes || '' : '');
  const [amount, setAmount] = useState(initial ? String(initial.amount) : '');
  const [currency, setCurrency] = useState(initial ? initial.currency
    : (startWallet === USD_WALLET ? 'USD' : config.defaultCurrency));
  const [method, setMethod] = useState(initial ? (initial.method || 'cash')
    : (startWallet === USD_WALLET ? 'cash' : 'credit'));
  const [category, setCategory] = useState(initial ? (initial.category || config.categories[0])
    : (startWallet === LODGING ? 'מלון' : (config.categories.find((c) => LODGING_CATS.indexOf(c) < 0) || config.categories[0])));

  // The wallet decides what is allowed: dollars are always cash in USD, the
  // card wallet is always a card, and only lodging may be either.
  const pickWallet = (w) => {
    setWallet(w);
    if (w === USD_WALLET) { setCurrency('USD'); setMethod('cash'); }
    if (w === CREDIT) { setMethod('credit'); if (currency === 'USD' && method === 'cash') setCurrency(config.defaultCurrency); }
    if (w === LODGING && LODGING_CATS.indexOf(category) < 0) setCategory('מלון');
  };

  const [rate, setRate] = useState(initial ? initial.rate : null);
  const [rateSource, setRateSource] = useState(initial ? (initial.rateSource || 'manual') : 'loading');
  const [rateDate, setRateDate] = useState(initial ? initial.rateDate || initial.date : null);
  const [manualRate, setManualRate] = useState(false);
  const [saving, setSaving] = useState(false);

  const reqId = useRef(0);
  const ensureRate = ctx.ensureRate;

  useEffect(() => {
    if (manualRate) return;
    let active = true;
    const myId = ++reqId.current;
    setRateSource('loading');
    ensureRate(date, currency).then((r) => {
      if (!active || myId !== reqId.current) return;
      setRate(r.rate);
      setRateSource(r.source);
      setRateDate(r.rateDate);
    });
    return () => { active = false; };
  }, [date, currency, manualRate, ensureRate]);

  const feePct = (method === 'credit' && currency !== 'ILS')
    ? (Number(config.creditFeePct) || 0) : 0;
  const countedNow = isCounted({ method: method, currency: currency });
  const amountNum = parseFloat(String(amount).replace(',', '.'));
  const validAmount = isFinite(amountNum) && amountNum > 0;
  const ils = validAmount && rate ? amountNum * rate * (1 + feePct / 100) : null;
  const canSave = validAmount && !!rate && !saving;

  const save = async () => {
    if (!canSave) return;
    setSaving(true);
    const payload = {
      wallet: wallet,
      preTrip: preTrip,
      date: date,
      title: title.trim(),
      notes: notes.trim(),
      amount: amountNum,
      currency: currency,
      method: method,
      category: category,
      rate: rate,
      rateDate: rateDate || date,
      rateSource: manualRate ? 'manual' : rateSource,
      feePct: feePct,
      amountILS: Math.round(ils * 100) / 100,
      deleted: false
    };
    try {
      await ctx.saveExpense(payload, isEdit ? initial.id : null);
    } catch (e) {
      // Offline writes resolve later; Firestore has already queued them.
    }
    ctx.showToast(isEdit ? 'הרשומה עודכנה' : 'הרשומה נשמרה');
    onClose();
  };

  const remove = () => {
    if (!window.confirm('למחוק את הרשומה? אפשר לשחזר אותה מההגדרות.')) return;
    ctx.setDeleted(initial.id, true);
    ctx.showToast('הרשומה נמחקה');
    onClose();
  };

  const leg = legForDate(config.legs, date);

  return (
    <div>
      <div className="scrim" onClick={onClose} />
      <div className="sheet" role="dialog" aria-modal="true">
        <div className="sheet-head">
          <button className="iconbtn" style={{ background: 'var(--jade-soft)', color: 'var(--jade-deep)' }} onClick={onClose} aria-label="סגירה">
            <Icon.close />
          </button>
          <div className="sheet-title">{isEdit ? 'עריכת רשומה' : 'רשומה חדשה'}</div>
          <div style={{ minWidth: 38, textAlign: 'start' }}>
            {isEdit && <button className="linkbtn" style={{ color: 'var(--clay)', whiteSpace: 'nowrap' }} onClick={remove}>מחיקה</button>}
          </div>
        </div>

        <div className="sheet-body">
          <div className="field">
            <label>ארנק</label>
            <div className="seg">
              {WALLET_IDS.map((w) => (
                <button key={w} className={wallet === w ? 'on' : ''} onClick={() => pickWallet(w)}>{WALLET_LABEL[w]}</button>
              ))}
            </div>
          </div>

          <div className="field">
            <label htmlFor="f-amount">סכום</label>
            <div className="row2">
              <input
                id="f-amount" className="input amount-input" type="text" inputMode="decimal"
                value={amount} placeholder="0" autoFocus={!isEdit}
                onChange={(ev) => setAmount(ev.target.value.replace(/[^\d.,]/g, ''))}
              />
              <select className="input" style={{ flex: '0 0 116px' }} value={currency}
                disabled={wallet === USD_WALLET}
                onChange={(ev) => setCurrency(ev.target.value)} aria-label="מטבע">
                {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.label}</option>)}
              </select>
            </div>
          </div>

          {wallet === LODGING && (
            <div className="field">
              <label>אמצעי תשלום</label>
              <div className="seg">
                <button className={method === 'credit' ? 'on' : ''} onClick={() => setMethod('credit')}>אשראי</button>
                <button className={method === 'cash' ? 'on' : ''} onClick={() => setMethod('cash')}>מזומן</button>
              </div>
            </div>
          )}

          {!countedNow && validAmount && (
            <div className="rate-box" style={{ background: 'var(--jade-soft)' }}>
              <div className="rate-line"><span>לא נספר בעלות הכוללת</span></div>
              <div className="rate-note">
                {curInfo(currency).label} במזומן הגיע מהמרת דולרים, והדולרים כבר נספרו בהמרה.
                הסכום יירשם ויוצג, אבל לא ייספר פעמיים.
              </div>
            </div>
          )}

          <div className="field">
            <RateBox
              currency={currency} rate={rate} rateSource={rateSource} rateDate={rateDate}
              manual={manualRate} onManual={setManualRate} onRate={setRate}
              ils={ils} feePct={feePct} validAmount={validAmount}
            />
          </div>

          <div className="field">
            <label htmlFor="f-title">על מה</label>
            <input id="f-title" className="input" value={title} placeholder="ארוחת ערב, טוק־טוק, כניסה למקדש"
              onChange={(ev) => setTitle(ev.target.value)} />
          </div>

          <label className="set-row" style={{ padding: '4px 2px 12px', cursor: 'pointer', borderBottom: 'none' }}>
            <input type="checkbox" checked={preTrip} onChange={(ev) => setPreTrip(ev.target.checked)}
              style={{ width: 20, height: 20, accentColor: 'var(--jade)' }} />
            <span className="grow">
              <span className="set-label">לפני הטיול</span>
              <span className="set-hint" style={{ display: 'block' }}>שולם מראש — התאריך לא רלוונטי ולא משויך ליעד</span>
            </span>
          </label>

          <div className="row2">
            {!preTrip && (
              <div className="field">
                <label htmlFor="f-date">תאריך</label>
                <input id="f-date" className="input" type="date" value={date} onChange={(ev) => setDate(ev.target.value)} />
                <div className="set-hint" style={{ marginTop: 4 }}>{leg ? leg.name : 'מחוץ לתאריכי הטיול'}</div>
              </div>
            )}
            <div className="field">
              <label htmlFor="f-cat">קטגוריה</label>
              <select id="f-cat" className="input" value={category} onChange={(ev) => setCategory(ev.target.value)}>
                {config.categories.map((c) => <option key={c} value={c}>{c}</option>)}
                {config.categories.indexOf(category) < 0 && <option value={category}>{category}</option>}
              </select>
            </div>
          </div>

          <div className="field">
            <label htmlFor="f-notes">פירוט</label>
            <textarea id="f-notes" className="input" value={notes} placeholder="מה בדיוק, עם מי, כל מה שתרצה לזכור"
              onChange={(ev) => setNotes(ev.target.value)} />
          </div>
        </div>

        <div className="sheet-foot">
          <button className="btn ghost" onClick={onClose}>ביטול</button>
          <button className="btn" onClick={save} disabled={!canSave}>
            {saving ? 'שומר…' : (isEdit ? 'שמירת שינויים' : 'שמירת רשומה')}
          </button>
        </div>
      </div>
    </div>
  );
}

function RateBox({ currency, rate, rateSource, rateDate, manual, onManual, onRate, ils, feePct, validAmount }) {
  const info = curInfo(currency);

  if (currency === 'ILS') {
    return (
      <div className="rate-box">
        <div className="rate-line"><span>הסכום כבר בשקלים</span></div>
        {validAmount && (
          <div className="rate-result">
            <span>סה"כ</span>
            <span className="val num">{fmtILS(ils)} ₪</span>
          </div>
        )}
      </div>
    );
  }

  let tag = null;
  if (rateSource === 'loading') tag = <span className="rate-tag">מושך שער…</span>;
  else if (manual || rateSource === 'manual') tag = <span className="rate-tag manual">שער ידני</span>;
  else if (rateSource === 'stale') tag = <span className="rate-tag stale">שער ידוע אחרון</span>;
  else if (rateSource === 'derived') tag = <span className="rate-tag">נגזר מהדולר</span>;
  else if (rateSource === 'none') tag = <span className="rate-tag stale">אין שער</span>;
  else tag = <span className="rate-tag">שער {fmtDayMonth(rateDate)}</span>;

  return (
    <div className="rate-box">
      <div className="rate-line">
        <span className="num" dir="ltr">
          1 {info.symbol} = {rate ? Number(rate).toFixed(4) : '—'} ₪
        </span>
        <span style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {tag}
          <button className="linkbtn" onClick={() => onManual(!manual)}>{manual ? 'חזרה לאוטומטי' : 'שינוי'}</button>
        </span>
      </div>

      {manual && (
        <input
          className="input" style={{ marginTop: 10 }} type="number" step="0.0001" inputMode="decimal"
          value={rate || ''} placeholder="כמה שקלים שווה יחידה אחת"
          onChange={(ev) => onRate(parseFloat(ev.target.value) || null)}
          aria-label="שער המרה ידני"
        />
      )}

      {rateSource === 'none' && !manual && (
        <div className="rate-note">אין חיבור ואין שער שמור לתאריך הזה. הזן שער ידנית כדי להמשיך.</div>
      )}
      {rateSource === 'stale' && !manual && (
        <div className="rate-note">השער מתאריך {fmtDayMonth(rateDate)}. יתעדכן כשיהיה חיבור.</div>
      )}

      {validAmount && rate && (
        <div className="rate-result">
          <span>
            סה"כ בשקלים
            {feePct > 0 && <span className="rate-note" style={{ display: 'block' }}>כולל עמלת אשראי {feePct}%</span>}
          </span>
          <span className="val num">{fmtILS(ils)} ₪</span>
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   Wallets
   ========================================================================= */

function fmtRate(v) {
  const n = Number(v) || 0;
  if (n >= 100) return n.toFixed(2);
  if (n >= 1) return n.toFixed(3);
  return n.toFixed(4);
}

function AllExpensesView({ ctx }) {
  const today = todayISO();
  const pre = ctx.expenses.filter((e) => e.preTrip);
  const groups = {};
  ctx.expenses.filter((e) => !e.preTrip).forEach((e) => {
    if (!groups[e.date]) groups[e.date] = { items: [], convs: [] };
    groups[e.date].items.push(e);
  });
  ctx.conversions.forEach((m) => {
    if (!groups[m.date]) groups[m.date] = { items: [], convs: [] };
    groups[m.date].convs.push(m);
  });
  const dates = Object.keys(groups).sort().reverse();
  const preTotal = pre.reduce((t, e) => t + (isCounted(e) ? (Number(e.amountILS) || 0) : 0), 0);

  return (
    <div>
      <SubHeader
        title="כל ההוצאות"
        subtitle={fmtILS(ctx.total) + ' ₪ · ' + ctx.expenses.length + ' רשומות'}
        onBack={() => ctx.setView({ name: 'home' })}
      />
      <section className="section">
        {dates.length === 0 && pre.length === 0 && (
          <div className="empty"><strong>עוד אין הוצאות</strong>הכפתור למטה מוסיף את הראשונה.</div>
        )}

        {dates.map((d) => {
          const g = groups[d];
          const leg = legForDate(ctx.config.legs, d);
          return (
            <div className={'day' + (d === today ? ' is-today' : '')} key={d}>
              <div className="day-head">
                <div>
                  <span className="day-date num">{fmtDayMonth(d)}</span>
                  <span className="day-dow">{d === today ? 'היום' : 'יום ' + dowOf(d)}{leg ? ' · ' + leg.name : ''}</span>
                </div>
                <span className="day-total num">{fmtILSShort(ctx.byDay[d] || 0)} ₪</span>
              </div>
              {g.convs.map((m) => <ConversionRow key={m.id} m={m} ctx={ctx} />)}
              {g.items.map((e) => <ExpenseRow key={e.id} expense={e} ctx={ctx} />)}
            </div>
          );
        })}

        {pre.length > 0 && (
          <div className="day">
            <div className="day-head">
              <div><span className="day-date">לפני הטיול</span></div>
              <span className="day-total num">{fmtILSShort(preTotal)} ₪</span>
            </div>
            {pre.map((e) => <ExpenseRow key={e.id} expense={e} ctx={ctx} />)}
          </div>
        )}
      </section>
    </div>
  );
}

function WalletDetail({ ctx, currency }) {
  const id = currency;
  const isUsd = id === USD_WALLET;
  const label = WALLET_LABEL[id] || '';
  const totalIls = ctx.walletTotals.totals[id] || 0;

  if (!isUsd) {
    const items = ctx.expenses.filter((e) => walletOf(e) === id)
      .slice().sort((a, b) => {
        if (!!a.preTrip !== !!b.preTrip) return a.preTrip ? 1 : -1;
        return a.date < b.date ? 1 : -1;
      });
    return (
      <div>
        <SubHeader title={label} subtitle={fmtILS(totalIls) + ' ₪ · ' + items.length + ' רשומות'} onBack={() => ctx.setView({ name: 'home' })} />
        <section className="section">
          {id === LODGING && ctx.walletTotals.skipped[id] > 0 && (
            <div className="set-hint" style={{ marginBottom: 10 }}>
              רשומות ששולמו במזומן בבאט מוצגות אבל לא נספרות, כי הכסף כבר נכלל בהמרת הדולרים.
            </div>
          )}
          {items.length === 0
            ? <div className="empty"><strong>עוד ריק כאן</strong>בטופס ההוצאה בחר בארנק הזה.</div>
            : items.map((e) => (
              <div key={e.id}>
                {e.preTrip && <div className="set-hint" style={{ margin: '2px 4px 4px' }}>לפני הטיול</div>}
                <ExpenseRow expense={e} ctx={ctx} />
              </div>
            ))}
        </section>
      </div>
    );
  }

  // Dollar wallet: a running-balance statement of deposits, conversions and
  // direct dollar spends.
  const entries = [];
  ctx.movements.forEach((m) => {
    const open = () => ctx.setSheet({ kind: 'movement', mode: 'edit', movement: m });
    if (m.type === 'cash-in' && m.currency === 'USD') {
      entries.push({ key: 'm' + m.id, date: m.date, seq: m.createdAt, delta: Number(m.amount) || 0, move: true,
        title: 'הפקדת דולר', meta: m.notes || 'הפקדה', onClick: open });
    }
    if (m.type === 'exchange' && m.fromCurrency === 'USD') {
      const conv = ctx.conversions.filter((c) => c.id === m.id)[0];
      entries.push({ key: 'x' + m.id, date: m.date, seq: m.createdAt, delta: -(Number(m.fromAmount) || 0), move: true,
        title: 'המרה ל' + curInfo(m.toCurrency).label,
        meta: 'קיבלת ' + fmtAmount(m.toAmount) + ' ' + curInfo(m.toCurrency).symbol +
              (m.fromAmount ? ' · שער ' + fmtRate((Number(m.toAmount) || 0) / (Number(m.fromAmount) || 1)) : '') +
              (conv && conv.fee > 0 ? ' · עמלה ' + fmtILSShort(conv.fee) + ' ₪' : ''),
        onClick: open });
    }
  });
  ctx.expenses.forEach((e) => {
    if (e.method === 'credit' || e.currency !== 'USD') return;
    entries.push({ key: 'e' + e.id, date: e.date, seq: e.createdAt, delta: -(Number(e.amount) || 0),
      title: e.title || e.category, meta: (e.category || 'הוצאה') + ' · ' + fmtILS(e.amountILS) + ' ₪',
      onClick: () => ctx.setSheet({ mode: 'edit', expense: e }) });
  });

  entries.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return (a.seq || '') < (b.seq || '') ? 1 : -1;
  });

  let running = ctx.usd.balance;
  const rows = entries.map((en) => {
    const after = running;
    running -= en.delta;
    return Object.assign({}, en, { after: after });
  });

  const rate = ctx.todayRates.USD || 0;

  return (
    <div>
      <SubHeader title={label} subtitle={'נכנס לעלות: ' + fmtILSShort(totalIls) + ' ₪'} onBack={() => ctx.setView({ name: 'home' })} />
      <section className="section">
        <div className="card" style={{ padding: 16 }}>
          <div className="set-hint">נשאר בארנק</div>
          <div className={'wcard-bal num' + (ctx.usd.balance < 0 ? ' neg' : '')} style={{ fontSize: '2rem' }}>
            {fmtAmount(ctx.usd.balance)} $
          </div>
          {rate > 0 && <div className="set-hint num">{fmtILS(ctx.usd.balance * rate)} ₪ · 1 $ = {rate.toFixed(3)} ₪</div>}
          <div className="wcard-rates">
            <span className="num">הומרו {fmtAmount(ctx.usd.converted)} $</span>
            <span className="num">הוצאו ישירות {fmtAmount(ctx.usd.spentDirect)} $</span>
            <span className="num">עלויות המרה {fmtILS(ctx.conversionFees)} ₪</span>
          </div>
        </div>
      </section>

      <section className="section">
        <div className="section-head">
          <h2 className="section-title">תנועות</h2>
          <span className="section-note">{rows.length} שורות</span>
        </div>
        {rows.length === 0
          ? <div className="empty"><strong>הארנק עוד ריק</strong>הכפתור למטה מוסיף הפקדה או המרה.</div>
          : rows.map((r) => (
            <button className={'exp' + (r.move ? ' mvrow' : '')} key={r.key} onClick={r.onClick}>
              <span className="exp-body">
                <span className="exp-title">{r.title}</span>
                <span className="exp-meta num">{fmtDayMonth(r.date)} · {r.meta}</span>
              </span>
              <span className="exp-amt">
                <span className={'exp-ils num' + (r.delta < 0 ? ' out' : ' in')}>
                  {r.delta < 0 ? '−' : '+'}{fmtAmount(Math.abs(r.delta))} $
                </span>
                <span className="exp-orig num">יתרה {fmtAmount(r.after)}</span>
              </span>
            </button>
          ))}
      </section>
    </div>
  );
}

/* =========================================================================
   Movement sheet
   ========================================================================= */

function MovementSheet({ ctx, initial, onClose }) {
  const [type, setType] = useState(initial && initial.type === 'cash-in' ? 'cash-in' : 'exchange');
  const [date, setDate] = useState(initial ? initial.date : todayISO());
  const [usdAmount, setUsdAmount] = useState(initial
    ? String(initial.type === 'cash-in' ? (initial.amount || '') : (initial.fromAmount || '')) : '');
  const [toCurrency, setToCurrency] = useState(initial && initial.toCurrency ? initial.toCurrency : 'THB');
  const [toAmount, setToAmount] = useState(initial && initial.toAmount != null ? String(initial.toAmount) : '');
  const [notes, setNotes] = useState(initial ? initial.notes || '' : '');
  const [usdRate, setUsdRate] = useState(initial && initial.usdRate ? initial.usdRate : null);
  const [saving, setSaving] = useState(false);

  const ensureRate = ctx.ensureRate;
  useEffect(() => {
    let active = true;
    ensureRate(date, 'USD').then((r) => { if (active && r.rate) setUsdRate(r.rate); });
    return () => { active = false; };
  }, [date, ensureRate]);

  const num = (v) => {
    const n = parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : 0;
  };

  const usdN = num(usdAmount);
  const toN = num(toAmount);
  const gotRate = usdN > 0 && toN > 0 ? toN / usdN : null;
  const valid = type === 'exchange' ? (usdN > 0 && toN > 0) : usdN > 0;

  const save = async () => {
    if (!valid || saving) return;
    setSaving(true);
    const payload = type === 'exchange'
      ? { type: 'exchange', date: date, fromCurrency: 'USD', fromAmount: usdN, toCurrency: toCurrency,
          toAmount: toN, usdRate: usdRate || null, notes: notes.trim(), deleted: false }
      : { type: 'cash-in', date: date, currency: 'USD', amount: usdN, feeAmount: 0, notes: notes.trim(), deleted: false };
    try { await ctx.saveMovement(payload, initial ? initial.id : null); } catch (e) { /* queued offline */ }
    ctx.showToast(initial ? 'התנועה עודכנה' : 'התנועה נשמרה');
    onClose();
  };

  const remove = () => {
    if (!window.confirm('למחוק את התנועה? היתרות יתעדכנו בהתאם.')) return;
    ctx.deleteMovement(initial.id);
    ctx.showToast('התנועה נמחקה');
    onClose();
  };

  const clean = (v) => v.replace(/[^\d.,]/g, '');

  return (
    <div>
      <div className="scrim" onClick={onClose} />
      <div className="sheet" role="dialog" aria-modal="true">
        <div className="sheet-head">
          <button className="iconbtn" style={{ background: 'var(--jade-soft)', color: 'var(--jade-deep)' }} onClick={onClose} aria-label="סגירה">
            <Icon.close />
          </button>
          <div className="sheet-title">{initial ? 'עריכת תנועה' : 'תנועה בארנק הדולר'}</div>
          <div style={{ minWidth: 38, textAlign: 'start' }}>
            {initial && <button className="linkbtn" style={{ color: 'var(--clay)', whiteSpace: 'nowrap' }} onClick={remove}>מחיקה</button>}
          </div>
        </div>

        <div className="sheet-body">
          <div className="field">
            <div className="seg">
              {MOVEMENT_TYPES.map((t) => (
                <button key={t.id} className={type === t.id ? 'on' : ''} onClick={() => setType(t.id)}>{t.label}</button>
              ))}
            </div>
          </div>

          <div className="field">
            <label htmlFor="mv-usd">{type === 'exchange' ? 'כמה דולר המרת' : 'כמה דולר נכנסו לארנק'}</label>
            <input id="mv-usd" className="input amount-input" type="text" inputMode="decimal" value={usdAmount}
              placeholder="0" onChange={(ev) => setUsdAmount(clean(ev.target.value))} />
          </div>

          {type === 'exchange' && (
            <div className="field">
              <label htmlFor="mv-to">כמה קיבלת</label>
              <div className="row2">
                <input id="mv-to" className="input amount-input" type="text" inputMode="decimal" value={toAmount}
                  placeholder="0" onChange={(ev) => setToAmount(clean(ev.target.value))} />
                <select className="input" style={{ flex: '0 0 116px' }} value={toCurrency}
                  onChange={(ev) => setToCurrency(ev.target.value)} aria-label="מטבע שהתקבל">
                  {CURRENCIES.filter((c) => c.code !== 'USD').map((c) => <option key={c.code} value={c.code}>{c.label}</option>)}
                </select>
              </div>
            </div>
          )}

          {type === 'exchange' && usdN > 0 && (
            <div className="rate-box">
              {gotRate && (
                <div className="rate-line">
                  <span className="num" dir="ltr">1 $ = {fmtRate(gotRate)} {curInfo(toCurrency).symbol}</span>
                  <span className="rate-tag">השער שקיבלת</span>
                </div>
              )}
              <div className="rate-result">
                <span>נכנס לעלות הטיול</span>
                <span className="val num">{usdRate ? fmtILS(usdN * usdRate) + ' ₪' : '—'}</span>
              </div>
              <div className="rate-note">לפי שער הדולר של {fmtDayMonth(date)}{usdRate ? ' · 1 $ = ' + usdRate.toFixed(3) + ' ₪' : ''}</div>
            </div>
          )}

          {type === 'cash-in' && (
            <div className="set-hint">הפקדה לא נכנסת לעלות. רק דולר שהומר או הוצא נספר.</div>
          )}

          <div className="field" style={{ marginTop: 14 }}>
            <label htmlFor="mv-date">תאריך</label>
            <input id="mv-date" className="input" type="date" value={date} onChange={(ev) => setDate(ev.target.value)} />
          </div>

          <div className="field">
            <label htmlFor="mv-notes">הערה</label>
            <input id="mv-notes" className="input" value={notes} placeholder="איפה, איזה דוכן"
              onChange={(ev) => setNotes(ev.target.value)} />
          </div>
        </div>

        <div className="sheet-foot">
          <button className="btn ghost" onClick={onClose}>ביטול</button>
          <button className="btn" onClick={save} disabled={!valid || saving}>{saving ? 'שומר…' : 'שמירה'}</button>
        </div>
      </div>
    </div>
  );
}

function MigrationDialog({ count, onArchive, onKeep }) {
  const [busy, setBusy] = useState(false);
  const go = (fn) => { setBusy(true); fn(); };
  return (
    <div>
      <div className="scrim" />
      <div className="sheet" role="dialog" aria-modal="true" style={{ top: 'auto', maxHeight: '80vh' }}>
        <div className="sheet-body">
          <div className="sheet-title" style={{ marginBottom: 8 }}>מבנה חדש: שלושה ארנקים</div>
          <p style={{ margin: '0 0 10px' }}>
            לינה ותחבורה, מזומן בדולר, ואשראי. ארנקי הבאט, הדרהם והשקל הוסרו.
          </p>
          {count > 0 ? (
            <p style={{ margin: 0 }}>
              נמצאו <strong className="num">{count}</strong> רשומות ישנות שלא שייכות לאף ארנק — הוצאות מזומן בבאט, בדרהם ובשקל, ותנועות שאינן בדולר.
              הן כבר לא נספרות בעלות. להעביר אותן לארכיון? תמיד אפשר לשחזר מ"רשומות שנמחקו".
            </p>
          ) : (
            <p style={{ margin: 0 }}>אין רשומות ישנות שצריך לטפל בהן.</p>
          )}
        </div>
        <div className="sheet-foot">
          <button className="btn ghost" disabled={busy} onClick={() => go(onKeep)}>{count > 0 ? 'להשאיר' : 'סגירה'}</button>
          {count > 0 && <button className="btn" disabled={busy} onClick={() => go(onArchive)}>לארכיון</button>}
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   Mount
   ========================================================================= */

// If rendering ever throws, show what happened and a way out instead of an
// empty screen. The data lives in the cloud, so nothing is lost by reloading.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }

  static getDerivedStateFromError(error) {
    return { error: error };
  }

  render() {
    if (!this.state.error) return this.props.children;
    const message = String(this.state.error && this.state.error.message ? this.state.error.message : this.state.error);
    return (
      <div className="signin">
        <h1>משהו השתבש</h1>
        <p>הנתונים שלך שמורים בענן ולא נפגעו. צלם את השגיאה למטה ושלח אותה.</p>
        <div className="err num" dir="ltr">{message}</div>
        <div className="set-hint num">{BUILD}</div>
        <button className="btn" style={{ marginTop: 12 }} onClick={() => {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
          }
          if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
          window.setTimeout(() => window.location.reload(), 400);
        }}>רענון מלא</button>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
