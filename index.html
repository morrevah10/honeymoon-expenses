<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>הוצאות ירח דבש</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#0F5C52" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#EAEEEA;
  --surface:#FFFFFF;
  --ink:#12211E;
  --muted:#63736E;
  --jade:#0F5C52;
  --jade-deep:#093C35;
  --jade-soft:#D7E5E1;
  --gold:#A8741C;
  --clay:#A8452F;
  --line:#D3DCD8;
  --radius:14px;
  --nav-h:64px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{margin:0;padding:0}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  overscroll-behavior-y:none;
}

button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}

.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);
}

/* ---------- hero ---------- */

.hero{
  background:var(--jade);
  color:#fff;
  padding:calc(env(safe-area-inset-top) + 20px) 20px 18px;
  border-end-start-radius:26px;
  border-end-end-radius:26px;
}

.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}

.hero-label{font-size:.82rem;color:rgba(255,255,255,.72);letter-spacing:.01em}

.hero-total{
  font-family:'Frank Ruhl Libre',Georgia,serif;
  font-weight:700;
  font-size:2.85rem;
  line-height:1.05;
  display:flex;
  align-items:baseline;
  gap:6px;
}
.hero-total .cur{font-size:1.35rem;font-weight:500;color:rgba(255,255,255,.66)}

.hero-sub{font-size:.86rem;color:rgba(255,255,255,.72);margin-top:4px}

/* ---------- trip spine ---------- */

.spine{margin-top:18px}
.spine-bars{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:46px;
}
.spine-day{
  flex:1 1 0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  height:100%;
  padding:0;
  min-width:0;
}
.spine-bar{
  display:block;
  width:100%;
  background:rgba(255,255,255,.34);
  border-radius:2px 2px 0 0;
  min-height:2px;
  transition:background .15s;
}
.spine-day.has .spine-bar{background:rgba(255,255,255,.78)}
.spine-day.today .spine-bar{background:#F0C86A}
.spine-legend{
  display:flex;
  justify-content:space-between;
  font-size:.68rem;
  color:rgba(255,255,255,.6);
  margin-top:6px;
}

/* ---------- status chip ---------- */

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:.72rem;
  padding:4px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.16);
  color:rgba(255,255,255,.9);
  white-space:nowrap;
}
.chip .dot{width:6px;height:6px;border-radius:50%;background:#7FD4A8}
.chip.warn .dot{background:#F0C86A}
.chip.off .dot{background:#E38A72}

.iconbtn{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.14);
  color:#fff;flex:none;
}

/* ---------- sections ---------- */

.section{padding:18px 16px 0}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin-bottom:10px;
}
.section-title{
  font-family:'Frank Ruhl Libre',Georgia,serif;
  font-size:1.12rem;font-weight:700;margin:0;
}
.section-note{font-size:.8rem;color:var(--muted)}

/* ---------- cards ---------- */

.card{
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid var(--line);
}

.leg{
  display:flex;align-items:center;gap:12px;
  width:100%;
  padding:14px;
  text-align:start;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:10px;
  color:inherit;
}
.leg.current{border-color:var(--jade);box-shadow:0 0 0 1px var(--jade)}
.leg-body{flex:1;min-width:0}
.leg-name{font-weight:700;font-size:1rem}
.leg-dates{font-size:.78rem;color:var(--muted)}
.leg-amt{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:1.18rem;white-space:nowrap}
.leg-count{font-size:.74rem;color:var(--muted);text-align:end}

.badge-now{
  font-size:.68rem;background:var(--jade-soft);color:var(--jade-deep);
  padding:2px 7px;border-radius:999px;margin-inline-start:6px;
  vertical-align:middle;
}

/* ---------- day groups ---------- */

.day{margin-bottom:14px}
.day-head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:0 4px 6px;
  border-bottom:1px solid var(--line);
  margin-bottom:8px;
}
.day-date{font-weight:700;font-size:.94rem}
.day-dow{font-weight:400;color:var(--muted);font-size:.82rem;margin-inline-start:6px}
.day-total{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:1rem}
.day.is-today .day-date{color:var(--jade)}

.exp{
  display:flex;align-items:flex-start;gap:10px;
  width:100%;text-align:start;color:inherit;
  padding:10px 12px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:6px;
}
.exp-body{flex:1;min-width:0;display:block}
.exp-title{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-meta{display:block;font-size:.74rem;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp-amt{text-align:end;white-space:nowrap}
.exp-ils{display:block;font-weight:700}
.exp-orig{display:block;font-size:.74rem;color:var(--muted)}

.cat-dot{
  display:block;
  width:9px;height:9px;border-radius:3px;margin-top:7px;flex:none;
  background:var(--jade);
}

.empty{
  text-align:center;padding:34px 20px;color:var(--muted);
}
.empty strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

/* ---------- bars in summary ---------- */

.bar-row{padding:11px 14px;border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:none}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.bar-name{font-weight:500}
.bar-val{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700}
.bar-track{height:6px;background:var(--jade-soft);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--jade);border-radius:3px}
.bar-pct{font-size:.72rem;color:var(--muted);margin-top:4px}

/* ---------- bottom nav + fab ---------- */

.nav{
  position:fixed;inset-inline:0;bottom:0;
  max-width:520px;margin:0 auto;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
  display:flex;align-items:stretch;
  z-index:40;
}
.nav button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:.7rem;color:var(--muted);
}
.nav button.active{color:var(--jade);font-weight:700}
.nav .spacer{flex:1}

.fab{
  position:fixed;
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) - 26px);
  inset-inline-start:50%;
  transform:translateX(50%);
  width:58px;height:58px;border-radius:50%;
  background:var(--jade);color:#fff;
  display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(9,60,53,.34);
  z-index:50;
}
html[dir="rtl"] .fab{transform:translateX(50%)}

/* ---------- sheet ---------- */

.scrim{
  position:fixed;inset:0;background:rgba(9,32,28,.42);z-index:60;
}
.sheet{
  position:fixed;inset-inline:0;bottom:0;top:0;
  max-width:520px;margin:0 auto;
  background:var(--paper);
  z-index:61;
  display:flex;flex-direction:column;
  animation:rise .18s ease-out;
}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.sheet-title{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:1.1rem}
.sheet-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.sheet-foot{
  padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
  background:var(--surface);
  border-top:1px solid var(--line);
  display:flex;gap:10px;
}

/* ---------- form ---------- */

.field{margin-bottom:14px}
.field > label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}

.input,select.input,textarea.input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px 12px;
  outline:none;
}
.input:focus-visible,select.input:focus-visible,textarea.input:focus-visible,
button:focus-visible,.leg:focus-visible,.exp:focus-visible{
  outline:2px solid var(--jade);outline-offset:2px;
}
textarea.input{min-height:64px;resize:vertical}

.row2{display:flex;gap:10px}
.row2 > *{flex:1;min-width:0}

.amount-input{
  font-family:'Frank Ruhl Libre',Georgia,serif;
  font-weight:700;font-size:1.5rem;
}

.seg{display:flex;background:var(--jade-soft);border-radius:11px;padding:3px;gap:3px}
.seg button{
  flex:1;padding:9px 6px;border-radius:9px;font-size:.9rem;color:var(--jade-deep);
}
.seg button.on{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(9,60,53,.12)}

.rate-box{
  background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:12px;
}
.rate-line{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rate-tag{font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--jade-soft);color:var(--jade-deep)}
.rate-tag.manual{background:#F6E7C9;color:#7A5411}
.rate-tag.stale{background:#F7DED6;color:#8A3522}
.rate-result{
  margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;
}
.rate-result .val{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:1.5rem}
.rate-note{font-size:.74rem;color:var(--muted);margin-top:4px}

.btn{
  padding:13px 16px;border-radius:12px;font-weight:700;text-align:center;
  background:var(--jade);color:#fff;flex:1;
}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--clay);color:#fff}
.btn.small{padding:9px 14px;font-size:.86rem;flex:none}
.btn[disabled]{opacity:.5;cursor:default}

.linkbtn{color:var(--jade);font-weight:500;font-size:.86rem;text-decoration:underline}

/* ---------- settings ---------- */

.set-row{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line);
}
.set-row:last-child{border-bottom:none}
.set-row .grow{flex:1;min-width:0}
.set-label{display:block;font-weight:500}
.set-hint{font-size:.76rem;color:var(--muted)}

.tag{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-size:.86rem;margin:0 0 8px 8px;
}
.tag button{color:var(--muted);font-size:1rem;line-height:1}

.legedit{padding:12px 14px;border-bottom:1px solid var(--line)}
.legedit:last-of-type{border-bottom:none}

.wcard{
  display:block;width:100%;text-align:start;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;color:inherit;
}
.wcard.credit{background:var(--jade-deep);border-color:var(--jade-deep);color:#fff}
.wcard-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wcard-cur{font-weight:700}
.wcard-bal{font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:1.5rem}
.wcard-bal.neg{color:var(--clay)}
.wcard.credit .wcard-bal.neg{color:#F0A68F}
.wcard-ils{font-size:.78rem;color:var(--muted);text-align:end}
.wcard.credit .wcard-ils{color:rgba(255,255,255,.7)}
.wcard-rates{
  display:flex;gap:14px;flex-wrap:wrap;
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-size:.76rem;color:var(--muted);
}
.wcard.credit .wcard-rates{border-top-color:rgba(255,255,255,.18);color:rgba(255,255,255,.7)}

.mv{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:start;color:inherit;
  padding:10px 12px;background:var(--jade-soft);border:1px solid var(--line);
  border-radius:12px;margin-bottom:6px;
}
.mv-body{flex:1;min-width:0;display:block}
.mv-title{display:block;font-weight:500}
.mv-meta{display:block;font-size:.74rem;color:var(--muted);margin-top:1px}
.mv-amt{text-align:end;white-space:nowrap;font-weight:700}
.mv-amt.out{color:var(--clay)}

.toast{
  position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  inset-inline:16px;max-width:488px;margin:0 auto;
  background:var(--jade-deep);color:#fff;
  padding:12px 16px;border-radius:12px;z-index:70;
  font-size:.9rem;text-align:center;
}

/* ---------- sign in ---------- */

.signin{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;
  padding:32px 24px;text-align:center;gap:8px;
}
.signin h1{
  font-family:'Frank Ruhl Libre',Georgia,serif;font-size:1.9rem;margin:0;
}
.signin p{color:var(--muted);margin:0 0 22px}

.splash{
  min-height:100vh;min-height:100dvh;display:grid;place-items:center;color:var(--muted);
}
.err{
  background:#F7DED6;color:#7A2E1C;border-radius:11px;padding:11px 13px;
  font-size:.86rem;margin:12px 0;text-align:start;
}
</style>
</head>
<body>
<div id="root"><div class="splash">טוען…</div></div>
<noscript>האפליקציה דורשת JavaScript.</noscript>

<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =========================================================================
   Constants
   ========================================================================= */

const CURRENCIES = [
  { code: 'THB', label: 'באט', symbol: '฿' },
  { code: 'USD', label: 'דולר', symbol: '$' },
  { code: 'AED', label: 'דרהם', symbol: 'AED' },
  { code: 'EUR', label: 'אירו', symbol: '€' },
  { code: 'ILS', label: 'שקל', symbol: '₪' },
  { code: 'GBP', label: 'לירה שטרלינג', symbol: '£' },
  { code: 'SGD', label: 'דולר סינגפורי', symbol: 'S$' },
  { code: 'MYR', label: 'רינגיט', symbol: 'RM' }
];

// The dirham is pegged to the US dollar at a fixed rate, so it is derived
// through USD rather than fetched directly.
const AED_PER_USD = 3.6725;

const DOW = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

const DEFAULT_CONFIG = {
  legs: [
    { id: 'l1', name: 'צ\'אנג מאי', start: '2026-09-12', end: '2026-09-17' },
    { id: 'l2', name: 'קו פאנגן', start: '2026-09-18', end: '2026-09-22' },
    { id: 'l3', name: 'קו סמוי', start: '2026-09-23', end: '2026-09-27' },
    { id: 'l4', name: 'קו טאו', start: '2026-09-28', end: '2026-10-03' },
    { id: 'l5', name: 'בנגקוק', start: '2026-10-04', end: '2026-10-07' }
  ],
  categories: ['אוכל', 'לינה', 'תחבורה', 'אטרקציות', 'קניות', 'ספא', 'אחר'],
  creditFeePct: 2.5,
  defaultCurrency: 'THB',
  cashCurrencies: ['THB', 'USD', 'AED'],
  referenceCurrency: 'USD'
};

const MOVEMENT_TYPES = [
  { id: 'withdrawal', label: 'משיכה מכספומט' },
  { id: 'cash-in', label: 'מזומן מהבית' },
  { id: 'exchange', label: 'החלפת כסף' }
];

const CAT_COLORS = ['#0F5C52', '#A8741C', '#A8452F', '#3D6E8C', '#6B4E8C', '#2F7A4A', '#8C6B3D', '#7A3B5C'];

/* =========================================================================
   Small helpers
   ========================================================================= */

function todayISO() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}

function addDaysISO(iso, n) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

function dowOf(iso) {
  return DOW[new Date(iso + 'T12:00:00').getDay()];
}

function fmtDayMonth(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  return Number(d) + '.' + Number(m);
}

function daysRange(start, end) {
  const out = [];
  if (!start || !end || start > end) return out;
  let cur = start;
  let guard = 0;
  while (cur <= end && guard < 400) {
    out.push(cur);
    cur = addDaysISO(cur, 1);
    guard++;
  }
  return out;
}

function fmtILS(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return v.toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtILSShort(n) {
  const v = Math.round(Number(n) || 0);
  return v.toLocaleString('he-IL');
}

function fmtAmount(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function curInfo(code) {
  return CURRENCIES.find((c) => c.code === code) || { code: code, label: code, symbol: code };
}

function legForDate(legs, date) {
  if (!date) return null;
  for (const leg of legs) {
    if (date >= leg.start && date <= leg.end) return leg;
  }
  return null;
}

function catColor(categories, name) {
  const i = categories.indexOf(name);
  return CAT_COLORS[(i < 0 ? categories.length : i) % CAT_COLORS.length];
}

function uid16() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

/* =========================================================================
   Exchange rates
   ========================================================================= */

async function fetchFromApi(date, currency) {
  const hosts = ['https://api.frankfurter.app', 'https://api.frankfurter.dev/v1'];
  let lastErr = null;
  for (const host of hosts) {
    try {
      const res = await fetch(host + '/' + date + '?from=' + currency + '&to=ILS', { cache: 'no-store' });
      if (!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      const value = data && data.rates && data.rates.ILS;
      if (typeof value !== 'number' || !isFinite(value) || value <= 0) throw new Error('bad payload');
      return { rate: value, rateDate: data.date || date };
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error('rate lookup failed');
}

async function lookupRate(date, currency) {
  if (currency === 'ILS') return { rate: 1, rateDate: date, source: 'fixed' };
  if (currency === 'AED') {
    const usd = await fetchFromApi(date, 'USD');
    return { rate: usd.rate / AED_PER_USD, rateDate: usd.rateDate, source: 'derived' };
  }
  const r = await fetchFromApi(date, currency);
  return { rate: r.rate, rateDate: r.rateDate, source: 'api' };
}

/* =========================================================================
   Firebase bootstrap
   ========================================================================= */

let auth = null;
let db = null;
let initError = null;

try {
  if (!window.FIREBASE_CONFIG || String(window.FIREBASE_CONFIG.apiKey).indexOf('PASTE_') === 0) {
    initError = 'missing-config';
  } else {
    firebase.initializeApp(window.FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function () {
      // Persistence is unavailable (for example in a private window). The app
      // still works, it just will not hold data while offline.
    });
  }
} catch (e) {
  initError = String(e && e.message ? e.message : e);
}

/* =========================================================================
   App
   ========================================================================= */

function App() {
  const [authReady, setAuthReady] = useState(false);
  const [user, setUser] = useState(null);
  const [authError, setAuthError] = useState('');
  const [signingIn, setSigningIn] = useState(false);

  const [config, setConfig] = useState(null);
  const [expenses, setExpenses] = useState([]);
  const [movements, setMovements] = useState([]);
  const [rates, setRates] = useState({});
  const [todayRates, setTodayRates] = useState({});
  const [dataReady, setDataReady] = useState(false);
  const [pending, setPending] = useState(false);
  const [online, setOnline] = useState(navigator.onLine);

  const [view, setView] = useState({ name: 'home' });
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState('');

  const showToast = useCallback((msg) => {
    setToast(msg);
    window.setTimeout(() => setToast(''), 2600);
  }, []);

  /* ---- connectivity ---- */
  useEffect(() => {
    const on = () => setOnline(true);
    const off = () => setOnline(false);
    window.addEventListener('online', on);
    window.addEventListener('offline', off);
    return () => {
      window.removeEventListener('online', on);
      window.removeEventListener('offline', off);
    };
  }, []);

  /* ---- auth ---- */
  useEffect(() => {
    if (!auth) {
      setAuthReady(true);
      return;
    }
    auth.getRedirectResult().catch((e) => {
      setAuthError(e && e.message ? e.message : 'ההתחברות נכשלה');
    });
    const unsub = auth.onAuthStateChanged((u) => {
      if (u && window.ALLOWED_EMAIL && u.email !== window.ALLOWED_EMAIL) {
        setAuthError('החשבון הזה לא מורשה לאפליקציה.');
        auth.signOut();
        setUser(null);
      } else {
        setUser(u);
        if (u) setAuthError('');
      }
      setAuthReady(true);
    });
    return unsub;
  }, []);

  const signIn = useCallback(async () => {
    if (!auth) return;
    setSigningIn(true);
    setAuthError('');
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      await auth.signInWithPopup(provider);
      setSigningIn(false);
    } catch (e) {
      const code = e && e.code ? e.code : '';
      if (code === 'auth/cancelled-popup-request' || code === 'auth/popup-closed-by-user') {
        setSigningIn(false);
        return;
      }
      // Popups are blocked inside some installed web apps. Fall back to the
      // full-page redirect flow.
      try {
        await auth.signInWithRedirect(provider);
      } catch (e2) {
        setSigningIn(false);
        setAuthError(e2 && e2.message ? e2.message : 'ההתחברות נכשלה');
      }
    }
  }, []);

  /* ---- data subscriptions ---- */
  useEffect(() => {
    if (!user || !db) return;
    setDataReady(false);
    setExpenses([]);
    setMovements([]);
    setRates({});
    const base = db.collection('users').doc(user.uid);
    let gotConfig = false;
    let gotExpenses = false;
    const markReady = () => {
      if (gotConfig && gotExpenses) setDataReady(true);
    };

    const unsubConfig = base.collection('meta').doc('config').onSnapshot((snap) => {
      if (snap.exists) {
        const data = snap.data() || {};
        setConfig({
          legs: Array.isArray(data.legs) && data.legs.length ? data.legs : DEFAULT_CONFIG.legs,
          categories: Array.isArray(data.categories) && data.categories.length ? data.categories : DEFAULT_CONFIG.categories,
          creditFeePct: typeof data.creditFeePct === 'number' ? data.creditFeePct : DEFAULT_CONFIG.creditFeePct,
          defaultCurrency: data.defaultCurrency || DEFAULT_CONFIG.defaultCurrency
        });
      } else {
        base.collection('meta').doc('config').set(DEFAULT_CONFIG).catch(() => {});
        setConfig(DEFAULT_CONFIG);
      }
      gotConfig = true;
      markReady();
    }, () => {
      setConfig(DEFAULT_CONFIG);
      gotConfig = true;
      markReady();
    });

    const unsubExp = base.collection('expenses').onSnapshot({ includeMetadataChanges: true }, (snap) => {
      const list = [];
      snap.forEach((doc) => list.push(Object.assign({ id: doc.id }, doc.data())));
      list.sort((a, b) => {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return (b.createdAt || '') < (a.createdAt || '') ? -1 : 1;
      });
      setExpenses(list);
      setPending(snap.metadata.hasPendingWrites);
      gotExpenses = true;
      markReady();
    }, () => {
      gotExpenses = true;
      markReady();
    });

    const unsubMov = base.collection('movements').onSnapshot({ includeMetadataChanges: true }, (snap) => {
      const list = [];
      snap.forEach((doc) => list.push(Object.assign({ id: doc.id }, doc.data())));
      list.sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : ((b.createdAt || '') < (a.createdAt || '') ? -1 : 1)));
      setMovements(list);
    }, () => {});

    const unsubRates = base.collection('rates').onSnapshot((snap) => {
      const map = {};
      snap.forEach((doc) => { map[doc.id] = doc.data(); });
      setRates(map);
    }, () => {});

    return () => { unsubConfig(); unsubExp(); unsubMov(); unsubRates(); };
  }, [user]);

  const ratesRef = useRef(rates);
  useEffect(() => { ratesRef.current = rates; }, [rates]);

  /* ---- rate resolution ---- */
  const ensureRate = useCallback(async (date, currency) => {
    if (currency === 'ILS') return { rate: 1, rateDate: date, source: 'fixed' };
    const key = date + '_' + currency;
    const cached = ratesRef.current[key];
    if (cached && typeof cached.rate === 'number') {
      return { rate: cached.rate, rateDate: cached.rateDate || date, source: cached.source || 'cache' };
    }
    try {
      const found = await lookupRate(date, currency);
      // Only store the rate when it is final: either it is the rate published
      // for that exact day, or the day is already in the past (weekends and
      // holidays legitimately resolve to the previous business day).
      const isFinal = found.rateDate === date || date < todayISO();
      if (isFinal && user && db) {
        db.collection('users').doc(user.uid).collection('rates').doc(key)
          .set({ rate: found.rate, rateDate: found.rateDate, source: found.source, currency: currency, date: date })
          .catch(() => {});
      }
      return found;
    } catch (e) {
      // No network and no cached value for this exact day: fall back to the
      // closest known rate for the same currency.
      const keys = Object.keys(ratesRef.current).filter((k) => k.endsWith('_' + currency));
      if (keys.length) {
        keys.sort();
        let best = keys[0];
        let bestGap = Infinity;
        for (const k of keys) {
          const kd = k.slice(0, 10);
          const gap = Math.abs(new Date(kd + 'T12:00:00') - new Date(date + 'T12:00:00'));
          if (gap < bestGap) { bestGap = gap; best = k; }
        }
        const near = ratesRef.current[best];
        return { rate: near.rate, rateDate: near.rateDate || best.slice(0, 10), source: 'stale' };
      }
      return { rate: null, rateDate: null, source: 'none' };
    }
  }, [user]);

  /* ---- writes ---- */
  const saveExpense = useCallback((data, id) => {
    if (!user || !db) return Promise.resolve();
    const col = db.collection('users').doc(user.uid).collection('expenses');
    const now = new Date().toISOString();
    if (id) {
      return col.doc(id).set(Object.assign({}, data, { updatedAt: now }), { merge: true });
    }
    return col.doc(uid16()).set(Object.assign({}, data, { createdAt: now, updatedAt: now, deleted: false }));
  }, [user]);

  const setDeleted = useCallback((id, value) => {
    if (!user || !db) return Promise.resolve();
    return db.collection('users').doc(user.uid).collection('expenses').doc(id)
      .set({ deleted: value, deletedAt: value ? new Date().toISOString() : null }, { merge: true });
  }, [user]);

  const purge = useCallback((id) => {
    if (!user || !db) return Promise.resolve();
    return db.collection('users').doc(user.uid).collection('expenses').doc(id).delete();
  }, [user]);

  const saveMovement = useCallback((data, id) => {
    if (!user || !db) return Promise.resolve();
    const col = db.collection('users').doc(user.uid).collection('movements');
    const now = new Date().toISOString();
    if (id) return col.doc(id).set(Object.assign({}, data, { updatedAt: now }), { merge: true });
    return col.doc(uid16()).set(Object.assign({}, data, { createdAt: now, updatedAt: now, deleted: false }));
  }, [user]);

  const deleteMovement = useCallback((id) => {
    if (!user || !db) return Promise.resolve();
    return db.collection('users').doc(user.uid).collection('movements').doc(id)
      .set({ deleted: true, deletedAt: new Date().toISOString() }, { merge: true });
  }, [user]);

  const saveConfig = useCallback((next) => {
    if (!user || !db) return Promise.resolve();
    setConfig(next);
    return db.collection('users').doc(user.uid).collection('meta').doc('config').set(next);
  }, [user]);

  /* ---- derived ---- */
  const live = useMemo(() => expenses.filter((e) => !e.deleted), [expenses]);
  const trashed = useMemo(() => expenses.filter((e) => e.deleted), [expenses]);
  const liveMoves = useMemo(() => movements.filter((m) => !m.deleted), [movements]);

  // An ATM withdrawal is not a purchase, but its fee is money that is really
  // gone - so the fee alone is surfaced as a spend item.
  const feeItems = useMemo(() => liveMoves
    .filter((m) => m.type === 'withdrawal' && Number(m.feeAmount) > 0)
    .map((m) => {
      const fee = Number(m.feeAmount) || 0;
      const rate = Number(m.rate) || 0;
      const pct = Number(m.feePct) || 0;
      return {
        id: 'fee_' + m.id, movementId: m.id, virtual: true,
        date: m.date, title: 'עמלת משיכה', notes: '', category: 'עמלות',
        currency: m.currency, amount: fee, method: 'credit',
        rate: rate, rateSource: m.rateSource, feePct: pct,
        amountILS: Math.round(fee * rate * (1 + pct / 100) * 100) / 100
      };
    }), [liveMoves]);

  const spend = useMemo(() => live.concat(feeItems), [live, feeItems]);

  const byDay = useMemo(() => {
    const map = {};
    for (const e of spend) {
      map[e.date] = (map[e.date] || 0) + (Number(e.amountILS) || 0);
    }
    return map;
  }, [spend]);

  const total = useMemo(() => spend.reduce((s, e) => s + (Number(e.amountILS) || 0), 0), [spend]);

  const cashCurrencies = (config && config.cashCurrencies) || [];
  const refCurrency = (config && config.referenceCurrency) || 'USD';

  const wallets = useMemo(() => {
    const cash = {};
    cashCurrencies.forEach((c) => { cash[c] = 0; });
    let creditILS = 0;

    for (const e of live) {
      if (e.method === 'credit') creditILS += Number(e.amountILS) || 0;
      else if (cash[e.currency] !== undefined) cash[e.currency] -= Number(e.amount) || 0;
    }

    for (const m of liveMoves) {
      if (m.type === 'exchange') {
        if (cash[m.fromCurrency] !== undefined) cash[m.fromCurrency] -= Number(m.fromAmount) || 0;
        if (cash[m.toCurrency] !== undefined) cash[m.toCurrency] += Number(m.toAmount) || 0;
      } else {
        const amt = Number(m.amount) || 0;
        const fee = Number(m.feeAmount) || 0;
        if (cash[m.currency] !== undefined) cash[m.currency] += amt;
        if (m.type === 'withdrawal') {
          creditILS += (amt + fee) * (Number(m.rate) || 0) * (1 + (Number(m.feePct) || 0) / 100);
        }
      }
    }
    return { cash: cash, creditILS: creditILS };
  }, [live, liveMoves, cashCurrencies.join(',')]);

  const cashTotalILS = useMemo(() => cashCurrencies.reduce(
    (s, c) => s + (wallets.cash[c] || 0) * (todayRates[c] || 0), 0
  ), [wallets, todayRates, cashCurrencies.join(',')]);

  const ratesKey = cashCurrencies.concat([refCurrency]).join(',');
  useEffect(() => {
    if (!config) return;
    let cancelled = false;
    const list = [];
    ratesKey.split(',').forEach((c) => { if (c && list.indexOf(c) < 0) list.push(c); });
    Promise.all(list.map((c) => ensureRate(todayISO(), c).then((r) => [c, r.rate])))
      .then((pairs) => {
        if (cancelled) return;
        const map = {};
        pairs.forEach((pair) => { if (pair[1]) map[pair[0]] = pair[1]; });
        setTodayRates(map);
      });
    return () => { cancelled = true; };
  }, [ratesKey, ensureRate, config]);

  /* ---- render gates ---- */
  if (initError === 'missing-config') return <ConfigNeeded />;
  if (initError) return <div className="splash">שגיאת אתחול: {initError}</div>;
  if (!authReady) return <div className="splash">טוען…</div>;
  if (!user) return <SignIn onSignIn={signIn} busy={signingIn} error={authError} />;
  if (!dataReady || !config) return <div className="splash">מסנכרן נתונים…</div>;

  const ctx = {
    config: config, expenses: spend, rawExpenses: live, trashed: trashed,
    movements: liveMoves, byDay: byDay, total: total,
    wallets: wallets, todayRates: todayRates, cashTotalILS: cashTotalILS,
    cashCurrencies: cashCurrencies, refCurrency: refCurrency,
    saveExpense: saveExpense, setDeleted: setDeleted, purge: purge, saveConfig: saveConfig,
    saveMovement: saveMovement, deleteMovement: deleteMovement,
    ensureRate: ensureRate, showToast: showToast, setView: setView, setSheet: setSheet,
    user: user, online: online, pending: pending
  };

  return (
    <div className="app">
      {view.name === 'home' && <HomeView ctx={ctx} />}
      {view.name === 'leg' && <LegView ctx={ctx} legId={view.id} focusDate={view.focusDate} />}
      {view.name === 'wallets' && <WalletsView ctx={ctx} />}
      {view.name === 'wallet' && <WalletDetail ctx={ctx} currency={view.currency} />}
      {view.name === 'summary' && <SummaryView ctx={ctx} />}
      {view.name === 'settings' && <SettingsView ctx={ctx} />}
      {view.name === 'trash' && <TrashView ctx={ctx} />}

      <button
        className="fab"
        onClick={() => setSheet(view.name === 'wallets' || view.name === 'wallet'
          ? { kind: 'movement', mode: 'new', currency: view.currency }
          : { mode: 'new' })}
        aria-label={view.name === 'wallets' || view.name === 'wallet' ? 'הוספת תנועה' : 'הוספת הוצאה'}
      >
        <Icon.plus />
      </button>

      <nav className="nav">
        <button className={view.name === 'home' || view.name === 'leg' ? 'active' : ''} onClick={() => setView({ name: 'home' })}>
          <Icon.home /><span>בית</span>
        </button>
        <button className={view.name === 'wallets' || view.name === 'wallet' ? 'active' : ''} onClick={() => setView({ name: 'wallets' })}>
          <Icon.wallet /><span>ארנק</span>
        </button>
        <div className="spacer" />
        <button className={view.name === 'summary' ? 'active' : ''} onClick={() => setView({ name: 'summary' })}>
          <Icon.chart /><span>סיכומים</span>
        </button>
        <div className="spacer" />
        <button className={view.name === 'settings' || view.name === 'trash' ? 'active' : ''} onClick={() => setView({ name: 'settings' })}>
          <Icon.gear /><span>הגדרות</span>
        </button>
      </nav>

      {sheet && sheet.kind === 'movement' && (
        <MovementSheet
          ctx={ctx}
          initial={sheet.mode === 'edit' ? sheet.movement : null}
          presetCurrency={sheet.currency}
          onClose={() => setSheet(null)}
        />
      )}

      {sheet && sheet.kind !== 'movement' && (
        <ExpenseSheet
          ctx={ctx}
          initial={sheet.mode === 'edit' ? sheet.expense : null}
          presetDate={sheet.date}
          onClose={() => setSheet(null)}
        />
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* =========================================================================
   Gate screens
   ========================================================================= */

function ConfigNeeded() {
  return (
    <div className="signin">
      <h1>עוד צעד אחד</h1>
      <p>קובץ <span className="num">config.js</span> עדיין מכיל ערכי דוגמה. פתח אותו והדבק את פרטי הפרויקט מ‑Firebase.</p>
    </div>
  );
}

function SignIn({ onSignIn, busy, error }) {
  return (
    <div className="signin">
      <h1>הוצאות ירח דבש</h1>
      <p>כל הרשומות נשמרות בענן ומחכות לך בכל מכשיר.</p>
      {error && <div className="err">{error}</div>}
      <button className="btn" onClick={onSignIn} disabled={busy}>
        {busy ? 'מתחבר…' : 'התחברות עם גוגל'}
      </button>
    </div>
  );
}

/* =========================================================================
   Home
   ========================================================================= */

function HomeView({ ctx }) {
  const config = ctx.config;
  const legs = config.legs;
  const today = todayISO();

  const tripStart = legs.length ? legs.map((l) => l.start).sort()[0] : today;
  const tripEnd = legs.length ? legs.map((l) => l.end).sort().slice(-1)[0] : today;
  const days = useMemo(() => daysRange(tripStart, tripEnd), [tripStart, tripEnd]);
  const maxDay = useMemo(() => days.reduce((m, d) => Math.max(m, ctx.byDay[d] || 0), 0), [days, ctx.byDay]);

  const legTotals = useMemo(() => {
    const map = {};
    const counts = {};
    let unassigned = 0;
    let unassignedCount = 0;
    for (const e of ctx.expenses) {
      const leg = legForDate(legs, e.date);
      if (leg) {
        map[leg.id] = (map[leg.id] || 0) + (Number(e.amountILS) || 0);
        counts[leg.id] = (counts[leg.id] || 0) + 1;
      } else {
        unassigned += Number(e.amountILS) || 0;
        unassignedCount++;
      }
    }
    return { map: map, counts: counts, unassigned: unassigned, unassignedCount: unassignedCount };
  }, [ctx.expenses, legs]);

  const currentLeg = legForDate(legs, today);
  const todayTotal = ctx.byDay[today] || 0;

  return (
    <div>
      <header className="hero">
        <div className="hero-top">
          <div className="hero-label">סך ההוצאות</div>
          <SyncChip online={ctx.online} pending={ctx.pending} />
        </div>
        <div className="hero-total">
          <span className="num">{fmtILS(ctx.total)}</span>
          <span className="cur">₪</span>
        </div>
        <div className="hero-sub">
          {ctx.expenses.length} רשומות · היום <span className="num">{fmtILSShort(todayTotal)} ₪</span>
        </div>
        <button
          className="hero-sub"
          style={{ color: 'rgba(255,255,255,.9)', textDecoration: 'underline', marginTop: 6, display: 'block' }}
          onClick={() => ctx.setView({ name: 'wallets' })}
        >
          נשאר בארנקים: <span className="num">{fmtILSShort(ctx.cashTotalILS)} ₪</span>
          {ctx.wallets.creditILS > 0 && <span className="num"> · אשראי −{fmtILSShort(ctx.wallets.creditILS)} ₪</span>}
        </button>

        {days.length > 1 && (
          <div className="spine">
            <div className="spine-bars">
              {days.map((d) => {
                const v = ctx.byDay[d] || 0;
                const h = maxDay > 0 ? Math.max(2, Math.round((v / maxDay) * 46)) : 2;
                const leg = legForDate(legs, d);
                const cls = 'spine-day' + (v > 0 ? ' has' : '') + (d === today ? ' today' : '');
                return (
                  <button
                    key={d}
                    className={cls}
                    title={fmtDayMonth(d) + ' · ' + fmtILSShort(v) + ' ₪'}
                    aria-label={fmtDayMonth(d) + ', ' + fmtILSShort(v) + ' שקלים'}
                    onClick={() => leg ? ctx.setView({ name: 'leg', id: leg.id, focusDate: d }) : null}
                  >
                    <span className="spine-bar" style={{ height: h + 'px' }} />
                  </button>
                );
              })}
            </div>
            <div className="spine-legend">
              <span className="num">{fmtDayMonth(tripStart)}</span>
              <span className="num">{fmtDayMonth(tripEnd)}</span>
            </div>
          </div>
        )}
      </header>

      <section className="section">
        <div className="section-head">
          <h2 className="section-title">יעדים</h2>
          <span className="section-note">לחיצה לפירוט</span>
        </div>

        {legs.map((leg) => (
          <button
            key={leg.id}
            className={'leg' + (currentLeg && currentLeg.id === leg.id ? ' current' : '')}
            onClick={() => ctx.setView({ name: 'leg', id: leg.id })}
          >
            <div className="leg-body">
              <div className="leg-name">
                {leg.name}
                {currentLeg && currentLeg.id === leg.id && <span className="badge-now">כאן עכשיו</span>}
              </div>
              <div className="leg-dates num">{fmtDayMonth(leg.start)} – {fmtDayMonth(leg.end)}</div>
            </div>
            <div>
              <div className="leg-amt num">{fmtILSShort(legTotals.map[leg.id] || 0)} ₪</div>
              <div className="leg-count">{legTotals.counts[leg.id] || 0} רשומות</div>
            </div>
            <Icon.chevron />
          </button>
        ))}

        {legTotals.unassignedCount > 0 && (
          <button className="leg" onClick={() => ctx.setView({ name: 'leg', id: '__none__' })}>
            <div className="leg-body">
              <div className="leg-name">מחוץ לתאריכי הטיול</div>
              <div className="leg-dates">רשומות שלא נכנסות לאף יעד</div>
            </div>
            <div>
              <div className="leg-amt num">{fmtILSShort(legTotals.unassigned)} ₪</div>
              <div className="leg-count">{legTotals.unassignedCount} רשומות</div>
            </div>
            <Icon.chevron />
          </button>
        )}

        {ctx.expenses.length === 0 && (
          <div className="empty">
            <strong>עוד אין רשומות</strong>
            הוצאה ראשונה נכנסת בכפתור הפלוס.
          </div>
        )}
      </section>
    </div>
  );
}

function SyncChip({ online, pending }) {
  if (!online) return <span className="chip off"><span className="dot" />אופליין · יסונכרן אחר כך</span>;
  if (pending) return <span className="chip warn"><span className="dot" />שומר…</span>;
  return <span className="chip"><span className="dot" />מסונכרן</span>;
}

/* =========================================================================
   Leg view
   ========================================================================= */

function SubHeader({ title, subtitle, onBack, right }) {
  return (
    <header className="hero" style={{ paddingBottom: '16px' }}>
      <div className="hero-top" style={{ marginBottom: 0 }}>
        <button className="iconbtn" onClick={onBack} aria-label="חזרה"><Icon.back /></button>
        <div style={{ flex: 1, textAlign: 'center' }}>
          <div style={{ fontFamily: "'Frank Ruhl Libre',Georgia,serif", fontWeight: 700, fontSize: '1.1rem' }}>{title}</div>
          {subtitle && <div className="hero-label">{subtitle}</div>}
        </div>
        <div style={{ width: 38, textAlign: 'start' }}>{right}</div>
      </div>
    </header>
  );
}

function LegView({ ctx, legId, focusDate }) {
  const config = ctx.config;
  const today = todayISO();
  const leg = legId === '__none__' ? null : config.legs.find((l) => l.id === legId);

  const items = useMemo(() => {
    if (legId === '__none__') return ctx.expenses.filter((e) => !legForDate(config.legs, e.date));
    if (!leg) return [];
    return ctx.expenses.filter((e) => e.date >= leg.start && e.date <= leg.end);
  }, [ctx.expenses, leg, legId, config.legs]);

  const sum = items.reduce((s, e) => s + (Number(e.amountILS) || 0), 0);

  const days = useMemo(() => {
    if (leg) return daysRange(leg.start, leg.end).slice().reverse();
    const set = {};
    items.forEach((e) => { set[e.date] = true; });
    return Object.keys(set).sort().reverse();
  }, [leg, items]);

  useEffect(() => {
    if (!focusDate) return;
    const el = document.getElementById('day-' + focusDate);
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, [focusDate]);

  return (
    <div>
      <SubHeader
        title={leg ? leg.name : 'מחוץ לתאריכי הטיול'}
        subtitle={leg ? fmtDayMonth(leg.start) + ' – ' + fmtDayMonth(leg.end) + ' · ' + fmtILSShort(sum) + ' ₪' : fmtILSShort(sum) + ' ₪'}
        onBack={() => ctx.setView({ name: 'home' })}
      />

      <section className="section">
        {days.map((d) => {
          const dayItems = items.filter((e) => e.date === d);
          const dayTotal = dayItems.reduce((s, e) => s + (Number(e.amountILS) || 0), 0);
          if (!dayItems.length && d > today) return null;
          return (
            <div className={'day' + (d === today ? ' is-today' : '')} id={'day-' + d} key={d}>
              <div className="day-head">
                <div>
                  <span className="day-date num">{fmtDayMonth(d)}</span>
                  <span className="day-dow">{d === today ? 'היום' : 'יום ' + dowOf(d)}</span>
                </div>
                <span className="day-total num">{dayTotal > 0 ? fmtILSShort(dayTotal) + ' ₪' : '—'}</span>
              </div>

              {dayItems.map((e) => (
                <ExpenseRow key={e.id} expense={e} ctx={ctx} />
              ))}

              {!dayItems.length && (
                <button className="exp" onClick={() => ctx.setSheet({ mode: 'new', date: d })} style={{ color: 'var(--muted)' }}>
                  <span className="exp-body">אין הוצאות ביום הזה · הוספה</span>
                </button>
              )}
            </div>
          );
        })}
      </section>
    </div>
  );
}

function ExpenseRow({ expense, ctx }) {
  const info = curInfo(expense.currency);
  const cat = expense.category || 'אחר';
  return (
    <button className="exp" onClick={() => {
      if (expense.virtual) {
        const m = ctx.movements.filter((x) => x.id === expense.movementId)[0];
        if (m) ctx.setSheet({ kind: 'movement', mode: 'edit', movement: m });
        return;
      }
      ctx.setSheet({ mode: 'edit', expense: expense });
    }}>
      <span className="cat-dot" style={{ background: catColor(ctx.config.categories, cat) }} />
      <span className="exp-body">
        <span className="exp-title">{expense.title || cat}</span>
        <span className="exp-meta">
          {cat} · {expense.method === 'credit' ? 'אשראי' : 'מזומן'}
          {expense.notes ? ' · ' + expense.notes.slice(0, 28) : ''}
        </span>
      </span>
      <span className="exp-amt">
        <span className="exp-ils num">{fmtILS(expense.amountILS)} ₪</span>
        {expense.currency !== 'ILS' && (
          <span className="exp-orig num">{fmtAmount(expense.amount)} {info.symbol}</span>
        )}
      </span>
    </button>
  );
}

/* =========================================================================
   Summary
   ========================================================================= */

function BarList({ rows }) {
  const max = rows.reduce((m, r) => Math.max(m, r.value), 0) || 1;
  const total = rows.reduce((s, r) => s + r.value, 0) || 1;
  if (!rows.length) return <div className="empty">אין נתונים להצגה.</div>;
  return (
    <div className="card">
      {rows.map((r) => (
        <div className="bar-row" key={r.key}>
          <div className="bar-top">
            <span className="bar-name">{r.label}</span>
            <span className="bar-val num">{fmtILSShort(r.value)} ₪</span>
          </div>
          <div className="bar-track">
            <div className="bar-fill" style={{ width: Math.round((r.value / max) * 100) + '%', background: r.color || 'var(--jade)' }} />
          </div>
          <div className="bar-pct num">{Math.round((r.value / total) * 100)}%</div>
        </div>
      ))}
    </div>
  );
}

function SummaryView({ ctx }) {
  const config = ctx.config;
  const exp = ctx.expenses;

  const byLeg = config.legs.map((l) => ({
    key: l.id,
    label: l.name,
    value: exp.filter((e) => e.date >= l.start && e.date <= l.end).reduce((s, e) => s + (Number(e.amountILS) || 0), 0)
  })).filter((r) => r.value > 0);

  const catMap = {};
  exp.forEach((e) => {
    const c = e.category || 'אחר';
    catMap[c] = (catMap[c] || 0) + (Number(e.amountILS) || 0);
  });
  const byCat = Object.keys(catMap)
    .map((c) => ({ key: c, label: c, value: catMap[c], color: catColor(config.categories, c) }))
    .sort((a, b) => b.value - a.value);

  const methodMap = { cash: 0, credit: 0 };
  exp.forEach((e) => { methodMap[e.method === 'credit' ? 'credit' : 'cash'] += Number(e.amountILS) || 0; });
  const byMethod = [
    { key: 'cash', label: 'מזומן', value: methodMap.cash },
    { key: 'credit', label: 'אשראי', value: methodMap.credit, color: 'var(--gold)' }
  ].filter((r) => r.value > 0);

  const curMap = {};
  exp.forEach((e) => {
    const c = e.currency || 'ILS';
    if (!curMap[c]) curMap[c] = { orig: 0, ils: 0 };
    curMap[c].orig += Number(e.amount) || 0;
    curMap[c].ils += Number(e.amountILS) || 0;
  });
  const curRows = Object.keys(curMap).sort((a, b) => curMap[b].ils - curMap[a].ils);

  const activeDays = Object.keys(ctx.byDay).filter((d) => ctx.byDay[d] > 0).length;
  const avg = activeDays ? ctx.total / activeDays : 0;

  return (
    <div>
      <SubHeader title="סיכומים" subtitle={fmtILS(ctx.total) + ' ₪ בסך הכול'} onBack={() => ctx.setView({ name: 'home' })} />

      <section className="section">
        <div className="card" style={{ padding: '14px' }}>
          <div className="bar-top" style={{ marginBottom: 0 }}>
            <span className="bar-name">ממוצע ליום פעיל</span>
            <span className="bar-val num">{fmtILSShort(avg)} ₪</span>
          </div>
          <div className="bar-pct">{activeDays} ימים עם הוצאות</div>
        </div>
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">לפי יעד</h2></div>
        <BarList rows={byLeg} />
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">לפי קטגוריה</h2></div>
        <BarList rows={byCat} />
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">לפי אמצעי תשלום</h2></div>
        <BarList rows={byMethod} />
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">לפי מטבע</h2></div>
        {curRows.length === 0 ? <div className="empty">אין נתונים להצגה.</div> : (
          <div className="card">
            {curRows.map((c) => (
              <div className="bar-row" key={c}>
                <div className="bar-top" style={{ marginBottom: 0 }}>
                  <span className="bar-name">{curInfo(c).label}</span>
                  <span className="bar-val num">{fmtILSShort(curMap[c].ils)} ₪</span>
                </div>
                <div className="bar-pct num">{fmtAmount(curMap[c].orig)} {curInfo(c).symbol}</div>
              </div>
            ))}
          </div>
        )}
      </section>
    </div>
  );
}

/* =========================================================================
   Settings
   ========================================================================= */

function SettingsView({ ctx }) {
  const config = ctx.config;
  const [newCat, setNewCat] = useState('');
  const fileRef = useRef(null);

  const updateLeg = (id, patch) => {
    ctx.saveConfig(Object.assign({}, config, {
      legs: config.legs.map((l) => (l.id === id ? Object.assign({}, l, patch) : l))
    }));
  };

  const addLeg = () => {
    const last = config.legs.length ? config.legs[config.legs.length - 1] : null;
    const start = last ? addDaysISO(last.end, 1) : todayISO();
    const leg = { id: uid16(), name: 'יעד חדש', start: start, end: addDaysISO(start, 2) };
    ctx.saveConfig(Object.assign({}, config, { legs: config.legs.concat([leg]) }));
  };

  const removeLeg = (id) => {
    if (!window.confirm('להסיר את היעד? הרשומות עצמן נשארות ויופיעו תחת "מחוץ לתאריכי הטיול".')) return;
    ctx.saveConfig(Object.assign({}, config, { legs: config.legs.filter((l) => l.id !== id) }));
  };

  const sortLegs = () => {
    const sorted = config.legs.slice().sort((a, b) => (a.start < b.start ? -1 : 1));
    ctx.saveConfig(Object.assign({}, config, { legs: sorted }));
    ctx.showToast('היעדים סודרו לפי תאריך');
  };

  const addCategory = () => {
    const name = newCat.trim();
    if (!name || config.categories.indexOf(name) >= 0) return;
    ctx.saveConfig(Object.assign({}, config, { categories: config.categories.concat([name]) }));
    setNewCat('');
  };

  const removeCategory = (name) => {
    ctx.saveConfig(Object.assign({}, config, { categories: config.categories.filter((c) => c !== name) }));
  };

  const exportCsv = () => {
    const head = ['תאריך', 'יעד', 'כותרת', 'פירוט', 'קטגוריה', 'אמצעי תשלום', 'מטבע', 'סכום', 'שער', 'מקור השער', 'עמלה %', 'סכום בשקלים'];
    const rows = ctx.expenses.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).map((e) => {
      const leg = legForDate(config.legs, e.date);
      return [
        e.date, leg ? leg.name : '', e.title || '', e.notes || '', e.category || '',
        e.method === 'credit' ? 'אשראי' : 'מזומן', e.currency, e.amount, e.rate,
        e.rateSource || '', e.feePct || 0, Math.round((Number(e.amountILS) || 0) * 100) / 100
      ];
    });
    const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const csv = '\uFEFF' + [head].concat(rows).map((r) => r.map(esc).join(',')).join('\r\n');
    download('honeymoon-expenses-' + todayISO() + '.csv', csv, 'text/csv;charset=utf-8');
  };

  const exportJson = () => {
    const payload = {
      exportedAt: new Date().toISOString(), config: config,
      expenses: ctx.rawExpenses.concat(ctx.trashed),
      movements: ctx.movements
    };
    download('honeymoon-expenses-' + todayISO() + '.json', JSON.stringify(payload, null, 2), 'application/json');
  };

  const importJson = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || !Array.isArray(data.expenses)) throw new Error('קובץ לא מזוהה');
        let count = 0;
        data.expenses.forEach((e) => {
          const copy = Object.assign({}, e);
          delete copy.id;
          ctx.saveExpense(copy, e.id);
          count++;
        });
        if (Array.isArray(data.movements)) {
          data.movements.forEach((m) => {
            const copy = Object.assign({}, m);
            delete copy.id;
            ctx.saveMovement(copy, m.id);
          });
        }
        if (data.config) ctx.saveConfig(data.config);
        ctx.showToast(count + ' רשומות יובאו');
      } catch (err) {
        ctx.showToast('הייבוא נכשל: הקובץ לא תקין');
      }
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <SubHeader title="הגדרות" onBack={() => ctx.setView({ name: 'home' })} />

      <section className="section">
        <div className="section-head">
          <h2 className="section-title">יעדים ותאריכים</h2>
          <button className="linkbtn" onClick={sortLegs}>סידור לפי תאריך</button>
        </div>
        <div className="card">
          {config.legs.map((leg) => (
            <div className="legedit" key={leg.id}>
              <div className="row2" style={{ marginBottom: 8 }}>
                <input
                  className="input"
                  value={leg.name}
                  onChange={(ev) => updateLeg(leg.id, { name: ev.target.value })}
                  aria-label="שם היעד"
                />
                <button className="btn ghost small" onClick={() => removeLeg(leg.id)}>הסרה</button>
              </div>
              <div className="row2">
                <div>
                  <label className="set-hint" htmlFor={'s-' + leg.id}>מתאריך</label>
                  <input id={'s-' + leg.id} className="input" type="date" value={leg.start}
                    onChange={(ev) => updateLeg(leg.id, { start: ev.target.value })} />
                </div>
                <div>
                  <label className="set-hint" htmlFor={'e-' + leg.id}>עד תאריך</label>
                  <input id={'e-' + leg.id} className="input" type="date" value={leg.end}
                    onChange={(ev) => updateLeg(leg.id, { end: ev.target.value })} />
                </div>
              </div>
            </div>
          ))}
        </div>
        <button className="btn ghost" style={{ marginTop: 10, width: '100%' }} onClick={addLeg}>הוספת יעד</button>
        <div className="set-hint" style={{ marginTop: 8 }}>
          יעד שתאריכיו חופפים ליעד קודם ייפסל לטובת הראשון ברשימה. עדיף לשמור על טווחים נפרדים.
        </div>
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">קטגוריות</h2></div>
        <div>
          {config.categories.map((c) => (
            <span className="tag" key={c}>
              <span className="cat-dot" style={{ background: catColor(config.categories, c), marginTop: 0 }} />
              {c}
              <button onClick={() => removeCategory(c)} aria-label={'הסרת ' + c}>×</button>
            </span>
          ))}
        </div>
        <div className="row2" style={{ marginTop: 6 }}>
          <input className="input" value={newCat} placeholder="קטגוריה חדשה"
            onChange={(ev) => setNewCat(ev.target.value)}
            onKeyDown={(ev) => { if (ev.key === 'Enter') addCategory(); }} />
          <button className="btn small" onClick={addCategory} disabled={!newCat.trim()}>הוספה</button>
        </div>
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">ארנקים</h2></div>
        <div>
          {CURRENCIES.filter((c) => c.code !== 'ILS').map((c) => {
            const on = (config.cashCurrencies || []).indexOf(c.code) >= 0;
            return (
              <button
                key={c.code}
                className="tag"
                style={on ? { borderColor: 'var(--jade)', background: 'var(--jade-soft)' } : { opacity: .65 }}
                onClick={() => {
                  const list = (config.cashCurrencies || []).slice();
                  const i = list.indexOf(c.code);
                  if (i >= 0) list.splice(i, 1); else list.push(c.code);
                  ctx.saveConfig(Object.assign({}, config, { cashCurrencies: list }));
                }}
              >
                {c.label} {on ? '✓' : '+'}
              </button>
            );
          })}
        </div>
        <div className="card" style={{ marginTop: 6 }}>
          <div className="set-row">
            <div className="grow">
              <div className="set-label">מטבע ייחוס</div>
              <div className="set-hint">מוצג בכל כרטיס ארנק לצד השקל</div>
            </div>
            <select className="input" style={{ width: 130 }} value={config.referenceCurrency || 'USD'}
              onChange={(ev) => ctx.saveConfig(Object.assign({}, config, { referenceCurrency: ev.target.value }))}>
              {CURRENCIES.filter((c) => c.code !== 'ILS').map((c) => <option key={c.code} value={c.code}>{c.label}</option>)}
            </select>
          </div>
        </div>
        <div className="set-hint" style={{ marginTop: 8 }}>
          הסרת מטבע מסתירה את הארנק שלו בלבד. הרשומות והתנועות נשמרות.
        </div>
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">כסף</h2></div>
        <div className="card">
          <div className="set-row">
            <div className="grow">
              <div className="set-label">עמלת המרה על אשראי</div>
              <div className="set-hint">נוספת אוטומטית לכל הוצאה שסומנה כאשראי</div>
            </div>
            <input
              className="input" style={{ width: 92, textAlign: 'center' }}
              type="number" inputMode="decimal" step="0.1" min="0" max="10"
              value={config.creditFeePct}
              onChange={(ev) => ctx.saveConfig(Object.assign({}, config, { creditFeePct: Number(ev.target.value) || 0 }))}
            />
          </div>
          <div className="set-row">
            <div className="grow">
              <div className="set-label">מטבע ברירת מחדל</div>
              <div className="set-hint">נבחר אוטומטית בכל רשומה חדשה</div>
            </div>
            <select className="input" style={{ width: 130 }} value={config.defaultCurrency}
              onChange={(ev) => ctx.saveConfig(Object.assign({}, config, { defaultCurrency: ev.target.value }))}>
              {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.label}</option>)}
            </select>
          </div>
        </div>
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">גיבוי</h2></div>
        <div className="card">
          <button className="set-row" style={{ width: '100%', textAlign: 'start' }} onClick={exportCsv}>
            <span className="grow"><span className="set-label">ייצוא לאקסל</span><span className="set-hint" style={{ display: 'block' }}>קובץ CSV עם כל הרשומות</span></span>
            <Icon.chevron />
          </button>
          <button className="set-row" style={{ width: '100%', textAlign: 'start' }} onClick={exportJson}>
            <span className="grow"><span className="set-label">ייצוא גיבוי מלא</span><span className="set-hint" style={{ display: 'block' }}>קובץ JSON שניתן לייבא בחזרה</span></span>
            <Icon.chevron />
          </button>
          <button className="set-row" style={{ width: '100%', textAlign: 'start' }} onClick={() => fileRef.current && fileRef.current.click()}>
            <span className="grow"><span className="set-label">ייבוא מגיבוי</span><span className="set-hint" style={{ display: 'block' }}>שחזור מקובץ JSON</span></span>
            <Icon.chevron />
          </button>
          <input ref={fileRef} type="file" accept="application/json" style={{ display: 'none' }}
            onChange={(ev) => { const f = ev.target.files && ev.target.files[0]; if (f) importJson(f); ev.target.value = ''; }} />
        </div>
      </section>

      <section className="section">
        <div className="card">
          <button className="set-row" style={{ width: '100%', textAlign: 'start' }} onClick={() => ctx.setView({ name: 'trash' })}>
            <span className="grow"><span className="set-label">רשומות שנמחקו</span><span className="set-hint" style={{ display: 'block' }}>{ctx.trashed.length} רשומות ניתנות לשחזור</span></span>
            <Icon.chevron />
          </button>
          <div className="set-row">
            <div className="grow">
              <div className="set-label">{ctx.user.email}</div>
              <div className="set-hint">הנתונים שמורים בענן תחת החשבון הזה</div>

            <button className="btn ghost small" onClick={() => auth.signOut()}>יציאה</button>
          </div>
        </div>
      </section>

  );
}

function download(name, content, type) {
  const blob = new Blob([content], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function ExpenseSheet({ ctx, initial, presetDate, onClose }) {
  const config = ctx.config;
  const isEdit = !!initial;

  const [date, setDate] = useState(initial ? initial.date : (presetDate || todayISO()));
  const [title, setTitle] = useState(initial ? initial.title || '' : '');
  const [notes, setNotes] = useState(initial ? initial.notes || '' : '');
  const [amount, setAmount] = useState(initial ? String(initial.amount) : '');
  const [currency, setCurrency] = useState(initial ? initial.currency : config.defaultCurrency);
  const [method, setMethod] = useState(initial ? (initial.method || 'cash') : 'cash');
  const [category, setCategory] = useState(initial ? (initial.category || config.categories[0]) : config.categories[0]);

  const [rate, setRate] = useState(initial ? initial.rate : null);
  const [rateSource, setRateSource] = useState(initial ? (initial.rateSource || 'manual') : 'loading');
  const [rateDate, setRateDate] = useState(initial ? initial.rateDate || initial.date : null);
  const [manualRate, setManualRate] = useState(false);
  const [saving, setSaving] = useState(false);

  const reqId = useRef(0);
  const ensureRate = ctx.ensureRate;

  useEffect(() => {
    if (manualRate) return;
    let active = true;
    const myId = ++reqId.current;
    setRateSource('loading');
    ensureRate(date, currency).then((r) => {
      if (!active || myId !== reqId.current) return;
      setRate(r.rate);
      setRateSource(r.source);
      setRateDate(r.rateDate);
    });
    return () => { active = false; };
  }, [date, currency, manualRate, ensureRate]);

  const feePct = method === 'credit' ? (Number(config.creditFeePct) || 0) : 0;
  const amountNum = parseFloat(String(amount).replace(',', '.'));
  const validAmount = isFinite(amountNum) && amountNum > 0;
  const ils = validAmount && rate ? amountNum * rate * (1 + feePct / 100) : null;
  const canSave = validAmount && !!rate && !saving;

  const save = async () => {
    if (!canSave) return;
    setSaving(true);
    const payload = {
      date: date,
      title: title.trim(),
      notes: notes.trim(),
      amount: amountNum,
      currency: currency,
      method: method,
      category: category,
      rate: rate,
      rateDate: rateDate || date,
      rateSource: manualRate ? 'manual' : rateSource,
      feePct: feePct,
      amountILS: Math.round(ils * 100) / 100,
      deleted: false
    };
    try {
      await ctx.saveExpense(payload, isEdit ? initial.id : null);
    } catch (e) {
      // Offline writes resolve later; Firestore has already queued them.
    }
    ctx.showToast(isEdit ? 'הרשומה עודכנה' : 'הרשומה נשמרה');
    onClose();
  };

  const remove = () => {
    if (!window.confirm('למחוק את הרשומה? אפשר לשחזר אותה מההגדרות.')) return;
    ctx.setDeleted(initial.id, true);
    ctx.showToast('הרשומה נמחקה');
    onClose();
  };

  const leg = legForDate(config.legs, date);

  return (
    <div>
      <div className="scrim" onClick={onClose} />
      <div className="sheet" role="dialog" aria-modal="true">
        <div className="sheet-head">
          <button className="iconbtn" style={{ background: 'var(--jade-soft)', color: 'var(--jade-deep)' }} onClick={onClose} aria-label="סגירה">
            <Icon.close />
          </button>
          <div className="sheet-title">{isEdit ? 'עריכת רשומה' : 'רשומה חדשה'}</div>
          <div style={{ minWidth: 38, textAlign: 'start' }}>
            {isEdit && <button className="linkbtn" style={{ color: 'var(--clay)', whiteSpace: 'nowrap' }} onClick={remove}>מחיקה</button>}
          </div>
        </div>

        <div className="sheet-body">
          <div className="field">
            <label htmlFor="f-amount">סכום</label>
            <div className="row2">
              <input
                id="f-amount" className="input amount-input" type="text" inputMode="decimal"
                value={amount} placeholder="0" autoFocus={!isEdit}
                onChange={(ev) => setAmount(ev.target.value.replace(/[^\d.,]/g, ''))}
              />
              <select className="input" style={{ flex: '0 0 116px' }} value={currency} onChange={(ev) => setCurrency(ev.target.value)} aria-label="מטבע">
                {CURRENCIES.map((c) => <option key={c.code} value={c.code}>{c.label}</option>)}
              </select>
            </div>
          </div>

          <div className="field">
            <label>אמצעי תשלום</label>
            <div className="seg">
              <button className={method === 'cash' ? 'on' : ''} onClick={() => setMethod('cash')}>מזומן</button>
              <button className={method === 'credit' ? 'on' : ''} onClick={() => setMethod('credit')}>אשראי</button>
            </div>
          </div>

          <div className="field">
            <RateBox
              currency={currency} rate={rate} rateSource={rateSource} rateDate={rateDate}
              manual={manualRate} onManual={setManualRate} onRate={setRate}
              ils={ils} feePct={feePct} validAmount={validAmount}
            />
          </div>

          <div className="field">
            <label htmlFor="f-title">על מה</label>
            <input id="f-title" className="input" value={title} placeholder="ארוחת ערב, טוק־טוק, כניסה למקדש"
              onChange={(ev) => setTitle(ev.target.value)} />
          </div>

          <div className="row2">
            <div className="field">
              <label htmlFor="f-date">תאריך</label>
              <input id="f-date" className="input" type="date" value={date} onChange={(ev) => setDate(ev.target.value)} />
              <div className="set-hint" style={{ marginTop: 4 }}>{leg ? leg.name : 'מחוץ לתאריכי הטיול'}</div>
            </div>
            <div className="field">
              <label htmlFor="f-cat">קטגוריה</label>
              <select id="f-cat" className="input" value={category} onChange={(ev) => setCategory(ev.target.value)}>
                {config.categories.map((c) => <option key={c} value={c}>{c}</option>)}
                {config.categories.indexOf(category) < 0 && <option value={category}>{category}</option>}
              </select>
            </div>
          </div>

          <div className="field">
            <label htmlFor="f-notes">פירוט</label>
            <textarea id="f-notes" className="input" value={notes} placeholder="מה בדיוק, עם מי, כל מה שתרצה לזכור"
              onChange={(ev) => setNotes(ev.target.value)} />
          </div>
        </div>

        <div className="sheet-foot">
          <button className="btn ghost" onClick={onClose}>ביטול</button>
          <button className="btn" onClick={save} disabled={!canSave}>
            {saving ? 'שומר…' : (isEdit ? 'שמירת שינויים' : 'שמירת רשומה')}
          </button>
        </div>
      </div>
    </div>
  );
}

function RateBox({ currency, rate, rateSource, rateDate, manual, onManual, onRate, ils, feePct, validAmount }) {
  const info = curInfo(currency);

  if (currency === 'ILS') {
    return (
      <div className="rate-box">
        <div className="rate-line"><span>הסכום כבר בשקלים</span></div>
        {validAmount && (
          <div className="rate-result">
            <span>סה"כ</span>
            <span className="val num">{fmtILS(ils)} ₪</span>
          </div>
        )}
      </div>
    );
  }

  let tag = null;
  if (rateSource === 'loading') tag = <span className="rate-tag">מושך שער…</span>;
  else if (manual || rateSource === 'manual') tag = <span className="rate-tag manual">שער ידני</span>;
  else if (rateSource === 'stale') tag = <span className="rate-tag stale">שער ידוע אחרון</span>;
  else if (rateSource === 'derived') tag = <span className="rate-tag">נגזר מהדולר</span>;
  else if (rateSource === 'none') tag = <span className="rate-tag stale">אין שער</span>;
  else tag = <span className="rate-tag">שער {fmtDayMonth(rateDate)}</span>;

  return (
    <div className="rate-box">
      <div className="rate-line">
        <span className="num" dir="ltr">
          1 {info.symbol} = {rate ? Number(rate).toFixed(4) : '—'} ₪
        </span>
        <span style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {tag}
          <button className="linkbtn" onClick={() => onManual(!manual)}>{manual ? 'חזרה לאוטומטי' : 'שינוי'}</button>
        </span>
      </div>

      {manual && (
        <input
          className="input" style={{ marginTop: 10 }} type="number" step="0.0001" inputMode="decimal"
          value={rate || ''} placeholder="כמה שקלים שווה יחידה אחת"
          onChange={(ev) => onRate(parseFloat(ev.target.value) || null)}
          aria-label="שער המרה ידני"
        />
      )}

      {rateSource === 'none' && !manual && (
        <div className="rate-note">אין חיבור ואין שער שמור לתאריך הזה. הזן שער ידנית כדי להמשיך.</div>
      )}
      {rateSource === 'stale' && !manual && (
        <div className="rate-note">השער מתאריך {fmtDayMonth(rateDate)}. יתעדכן כשיהיה חיבור.</div>
      )}

      {validAmount && rate && (
        <div className="rate-result">
          <span>
            סה"כ בשקלים
            {feePct > 0 && <span className="rate-note" style={{ display: 'block' }}>כולל עמלת אשראי {feePct}%</span>}
          </span>
          <span className="val num">{fmtILS(ils)} ₪</span>
        </div>
      )}
    </div>
  );
}

function fmtRate(v) {
  const n = Number(v) || 0;
  if (n >= 100) return n.toFixed(2);
  if (n >= 1) return n.toFixed(3);
  return n.toFixed(4);
}

// Builds a readable cross-rate line, flipping the direction so the number
// shown is always the larger, easier-to-read side.
function crossLine(cur, other, rates) {
  const rc = rates[cur];
  const ro = other === 'ILS' ? 1 : rates[other];
  if (!rc || !ro) return null;
  const perOther = ro / rc;
  const cs = curInfo(cur).symbol;
  const os = other === 'ILS' ? '₪' : curInfo(other).symbol;
  if (perOther >= 1) return '1 ' + os + ' = ' + fmtRate(perOther) + ' ' + cs;
  return '1 ' + cs + ' = ' + fmtRate(1 / perOther) + ' ' + os;
}

function MovementRow({ m, ctx, focusCurrency }) {
  const label = (MOVEMENT_TYPES.find((t) => t.id === m.type) || {}).label || 'תנועה';
  let text = '';
  let out = false;

  if (m.type === 'exchange') {
    text = fmtAmount(m.fromAmount) + ' ' + curInfo(m.fromCurrency).symbol +
           ' ← ' + fmtAmount(m.toAmount) + ' ' + curInfo(m.toCurrency).symbol;
    out = focusCurrency === m.fromCurrency;
  } else {
    text = '+' + fmtAmount(m.amount) + ' ' + curInfo(m.currency).symbol;
    if (focusCurrency === '__credit__') {
      const gross = (Number(m.amount) || 0) + (Number(m.feeAmount) || 0);
      text = '−' + fmtILS(gross * (Number(m.rate) || 0) * (1 + (Number(m.feePct) || 0) / 100)) + ' ₪';
      out = true;
    }
  }

  return (
    <button className="mv" onClick={() => ctx.setSheet({ kind: 'movement', mode: 'edit', movement: m })}>
      <span className="mv-body">
        <span className="mv-title">{label}</span>
        <span className="mv-meta num">
          {fmtDayMonth(m.date)}
          {m.notes ? ' · ' + m.notes.slice(0, 24) : ''}
          {Number(m.feeAmount) > 0 ? ' · עמלה ' + fmtAmount(m.feeAmount) + ' ' + curInfo(m.currency).symbol : ''}
        </span>
      </span>
      <span className={'mv-amt num' + (out ? ' out' : '')}>{text}</span>
    </button>
  );
}

function WalletDetail({ ctx, currency }) {
  const isCredit = currency === '__credit__';
  const info = isCredit ? null : curInfo(currency);

  // In the credit ledger the withdrawal row already carries its own fee, so
  // the derived fee item is left out to avoid showing it twice.
  const myExpenses = ctx.expenses.filter((e) => isCredit
    ? (e.method === 'credit' && !e.virtual)
    : (e.method !== 'credit' && e.currency === currency));

  const myMoves = ctx.movements.filter((m) => {
    if (isCredit) return m.type === 'withdrawal';
    if (m.type === 'exchange') return m.fromCurrency === currency || m.toCurrency === currency;
    return m.currency === currency;
  });

  const rows = myExpenses.map((e) => ({ key: 'e' + e.id, date: e.date, node: <ExpenseRow expense={e} ctx={ctx} /> }))
    .concat(myMoves.map((m) => ({ key: 'm' + m.id, date: m.date, node: <MovementRow m={m} ctx={ctx} focusCurrency={currency} /> })))
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  const bal = isCredit ? -ctx.wallets.creditILS : (ctx.wallets.cash[currency] || 0);
  const ils = isCredit ? bal : bal * (ctx.todayRates[currency] || 0);
  const spent = myExpenses.reduce((sum, e) => sum + (Number(e.amountILS) || 0), 0);

  return (
    <div>
      <SubHeader
        title={isCredit ? 'ארנק אשראי' : 'ארנק ' + info.label}
        subtitle={'הוצאות: ' + fmtILSShort(spent) + ' ₪'}
        onBack={() => ctx.setView({ name: 'wallets' })}
      />

      <section className="section">
        <div className="card" style={{ padding: 16 }}>
          <div className="hero-label" style={{ color: 'var(--muted)' }}>יתרה</div>
          <div className={'wcard-bal num' + (bal < 0 ? ' neg' : '')} style={{ fontSize: '2rem' }}>
            {isCredit ? '−' + fmtILS(Math.abs(bal)) + ' ₪' : fmtAmount(bal) + ' ' + info.symbol}
          </div>
          {!isCredit && <div className="set-hint num">{fmtILS(ils)} ₪ לפי שער היום</div>}
          {!isCredit && (
            <div className="wcard-rates">
              {crossLine(currency, 'ILS', ctx.todayRates) && <span className="num">{crossLine(currency, 'ILS', ctx.todayRates)}</span>}
              {currency !== ctx.refCurrency && crossLine(currency, ctx.refCurrency, ctx.todayRates) &&
                <span className="num">{crossLine(currency, ctx.refCurrency, ctx.todayRates)}</span>}
            </div>
          )}
        </div>
      </section>

      <section className="section">
        <div className="section-head"><h2 className="section-title">תנועות והוצאות</h2></div>
        {rows.length === 0
          ? <div className="empty"><strong>עוד אין תנועה בארנק הזה</strong>הכפתור למטה מוסיף הפקדה או המרה.</div>
          : rows.map((r) => <div key={r.key}>{r.node}</div>)}
      </section>
    </div>
  );
}

   Movement sheet
