function MovementSheet({ ctx, initial, presetCurrency, onClose }) {
  const cash = ctx.cashCurrencies;
  const fallback = presetCurrency && presetCurrency !== '__credit__' ? presetCurrency : (cash[0] || 'THB');

  const [type, setType] = useState(initial ? initial.type : 'withdrawal');
  const [date, setDate] = useState(initial ? initial.date : todayISO());
  const [currency, setCurrency] = useState(initial ? (initial.currency || fallback) : fallback);
  const [amount, setAmount] = useState(initial && initial.amount != null ? String(initial.amount) : '');
  const [feeAmount, setFeeAmount] = useState(initial && initial.feeAmount ? String(initial.feeAmount) : '');
  const [fromCurrency, setFromCurrency] = useState(initial ? (initial.fromCurrency || cash[1] || 'USD') : (cash[1] || 'USD'));
  const [toCurrency, setToCurrency] = useState(initial ? (initial.toCurrency || fallback) : fallback);
  const [fromAmount, setFromAmount] = useState(initial && initial.fromAmount != null ? String(initial.fromAmount) : '');
  const [toAmount, setToAmount] = useState(initial && initial.toAmount != null ? String(initial.toAmount) : '');
  const [notes, setNotes] = useState(initial ? initial.notes || '' : '');
  const [rate, setRate] = useState(initial ? initial.rate : null);
  const [saving, setSaving] = useState(false);

  const ensureRate = ctx.ensureRate;
  useEffect(() => {
    if (type === 'exchange') return;
    let active = true;
    ensureRate(date, currency).then((r) => { if (active) setRate(r.rate); });
    return () => { active = false; };
  }, [date, currency, type, ensureRate]);

  const num = (v) => {
    const n = parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : 0;
  };

  const feePct = Number(ctx.config.creditFeePct) || 0;
  const amt = num(amount);
  const fee = num(feeAmount);
  const creditIls = rate ? (amt + fee) * rate * (1 + feePct / 100) : null;

  const fA = num(fromAmount);
  const tA = num(toAmount);
  const gotRate = fA > 0 && tA > 0 ? tA / fA : null;
  const marketRate = (ctx.todayRates[fromCurrency] && ctx.todayRates[toCurrency])
    ? ctx.todayRates[fromCurrency] / ctx.todayRates[toCurrency] : null;
  const gapPct = gotRate && marketRate ? ((gotRate - marketRate) / marketRate) * 100 : null;

  const valid = type === 'exchange'
    ? (fA > 0 && tA > 0 && fromCurrency !== toCurrency)
    : (amt > 0 && (type === 'cash-in' || !!rate));

  const save = async () => {
    if (!valid || saving) return;
    setSaving(true);
    let payload;
    if (type === 'exchange') {
      payload = { type: type, date: date, fromCurrency: fromCurrency, fromAmount: fA,
                  toCurrency: toCurrency, toAmount: tA, notes: notes.trim(), deleted: false };
    } else {
      payload = { type: type, date: date, currency: currency, amount: amt,
                  feeAmount: fee, notes: notes.trim(), deleted: false };
      if (type === 'withdrawal') {
        payload.rate = rate;
        payload.feePct = feePct;
        payload.rateSource = 'api';
      }
    }
    try { await ctx.saveMovement(payload, initial ? initial.id : null); } catch (e) { /* queued offline */ }
    ctx.showToast(initial ? 'התנועה עודכנה' : 'התנועה נשמרה');
    onClose();
  };

  const remove = () => {
    if (!window.confirm('למחוק את התנועה? היתרות יתעדכנו בהתאם.')) return;
    ctx.deleteMovement(initial.id);
    ctx.showToast('התנועה נמחקה');
    onClose();
  };

  const options = cash.length ? cash : CURRENCIES.map((c) => c.code);

  return (
    <div>
      <div className="scrim" onClick={onClose} />
      <div className="sheet" role="dialog" aria-modal="true">
        <div className="sheet-head">
          <button className="iconbtn" style={{ background: 'var(--jade-soft)', color: 'var(--jade-deep)' }} onClick={onClose} aria-label="סגירה">
            <Icon.close />
          </button>
          <div className="sheet-title">{initial ? 'עריכת תנועה' : 'תנועה חדשה'}</div>
          <div style={{ minWidth: 38, textAlign: 'start' }}>
            {initial && <button className="linkbtn" style={{ color: 'var(--clay)', whiteSpace: 'nowrap' }} onClick={remove}>מחיקה</button>}
          </div>
        </div>

        <div className="sheet-body">
          <div className="field">
            <label>סוג התנועה</label>
            <div className="seg">
              {MOVEMENT_TYPES.map((t) => (
                <button key={t.id} className={type === t.id ? 'on' : ''} onClick={() => setType(t.id)}>{t.label}</button>
              ))}
            </div>
          </div>

          {type !== 'exchange' && (
            <div className="field">
              <label htmlFor="m-amount">כמה נכנס לארנק</label>
              <div className="row2">
                <input id="m-amount" className="input amount-input" type="text" inputMode="decimal" value={amount}
                  placeholder="0" onChange={(ev) => setAmount(ev.target.value.replace(/[^\d.,]/g, ''))} />
                <select className="input" style={{ flex: '0 0 116px' }} value={currency}
                  onChange={(ev) => setCurrency(ev.target.value)} aria-label="מטבע">
                  {options.map((c) => <option key={c} value={c}>{curInfo(c).label}</option>)}
                </select>
              </div>
            </div>
          )}

          {type === 'withdrawal' && (
            <div className="field">
              <label htmlFor="m-fee">עמלת משיכה (לא חובה)</label>
              <input id="m-fee" className="input" type="text" inputMode="decimal" value={feeAmount}
                placeholder="למשל 220" onChange={(ev) => setFeeAmount(ev.target.value.replace(/[^\d.,]/g, ''))} />
              <div className="set-hint" style={{ marginTop: 4 }}>
                העמלה נספרת כהוצאה, המשיכה עצמה לא.
              </div>
            </div>
          )}

          {type === 'withdrawal' && (
            <div className="rate-box">
              <div className="rate-line">
                <span>חיוב צפוי בכרטיס</span>
                <span className="val num" style={{ fontFamily: "'Frank Ruhl Libre',Georgia,serif", fontWeight: 700 }}>
                  {creditIls ? fmtILS(creditIls) + ' ₪' : '—'}
                </span>
              </div>
              <div className="rate-note">כולל עמלת המרה של {feePct}%. יורד מארנק האשראי.</div>
            </div>
          )}

          {type === 'exchange' && (
            <div>
              <div className="field">
                <label htmlFor="x-from">כמה נתת</label>
                <div className="row2">
                  <input id="x-from" className="input amount-input" type="text" inputMode="decimal" value={fromAmount}
                    placeholder="0" onChange={(ev) => setFromAmount(ev.target.value.replace(/[^\d.,]/g, ''))} />
                  <select className="input" style={{ flex: '0 0 116px' }} value={fromCurrency}
                    onChange={(ev) => setFromCurrency(ev.target.value)} aria-label="ממטבע">
                    {options.map((c) => <option key={c} value={c}>{curInfo(c).label}</option>)}
                  </select>
                </div>
              </div>

              <div className="field">
                <label htmlFor="x-to">כמה קיבלת</label>
                <div className="row2">
                  <input id="x-to" className="input amount-input" type="text" inputMode="decimal" value={toAmount}
                    placeholder="0" onChange={(ev) => setToAmount(ev.target.value.replace(/[^\d.,]/g, ''))} />
                  <select className="input" style={{ flex: '0 0 116px' }} value={toCurrency}
                    onChange={(ev) => setToCurrency(ev.target.value)} aria-label="למטבע">
                    {options.map((c) => <option key={c} value={c}>{curInfo(c).label}</option>)}
                  </select>
                </div>
              </div>

              {gotRate && (
                <div className="rate-box">
                  <div className="rate-line">
                    <span className="num" dir="ltr">
                      1 {curInfo(fromCurrency).symbol} = {fmtRate(gotRate)} {curInfo(toCurrency).symbol}
                    </span>
                    <span className="rate-tag">השער שקיבלת</span>
                  </div>
                  {gapPct != null && (
                    <div className="rate-note">
                      {gapPct >= -0.05
                        ? 'טוב או שווה לשער השוק.'
                        : 'נמוך ב־' + Math.abs(gapPct).toFixed(1) + '% משער השוק, כלומר ' +
                          fmtAmount(Math.abs(fA * marketRate - tA)) + ' ' + curInfo(toCurrency).symbol + ' פחות.'}
                    </div>
                  )}
                </div>
              )}

              {fromCurrency === toCurrency && <div className="err">בחר שני מטבעות שונים.</div>}
            </div>
          )}

          <div className="field" style={{ marginTop: 14 }}>
            <label htmlFor="m-date">תאריך</label>
            <input id="m-date" className="input" type="date" value={date} onChange={(ev) => setDate(ev.target.value)} />
          </div>

          <div className="field">
            <label htmlFor="m-notes">הערה</label>
            <input id="m-notes" className="input" value={notes} placeholder="איפה, איזה דוכן, מה שתרצה"
              onChange={(ev) => setNotes(ev.target.value)} />
          </div>
        </div>

        <div className="sheet-foot">
          <button className="btn ghost" onClick={onClose}>ביטול</button>
          <button className="btn" onClick={save} disabled={!valid || saving}>
            {saving ? 'שומר…' : 'שמירה'}
          </button>
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   Mount
   ========================================================================= */

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
